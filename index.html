<script>
/* ---------- 進出港申請：卡片＋大按鈕 ---------- */
let A8 = { st: '待審', kind: '', q: '' };
const stOK = (a, st) => st === '全部' ? true : st === '已核准' ? a.status === '通過' : st === '退回/註銷' ? ['退回', '註銷'].includes(a.status) : a.status === '待審';
VIEWS.apply = () => {
  const staff = isStaff(), ro = !canEdit(); const ids = new Set(visibleShips().map(s => s.id));
  const mine = S.apps.filter(a => ids.has(a.shipId));
  const kindOK = a => !A8.kind || (A8.kind === '預報' ? a.kind.includes('預報') : a.kind === A8.kind);
  const as = mine.filter(a => stOK(a, A8.st) && kindOK(a) && (!A8.q || (ship(a.shipId).name + a.no + (voy(a.voyageId)?.code || '')).includes(A8.q)))

function fieldHtml8(f, data) {

  if (f.type === 'select') inp = `<select id="f_${f.k}" ${dis}>${(f.opts || []).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;

  else inp = `<input id="f_${f.k}" type="${f.type || 'text'}" value="${f.type === 'file' ? '' : esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${f.type === 'number' ? 'min="0"' : ''} ${dis}>`;
  return `<div class="f ${f.full ? 'full' : ''}"><label>${esc(f.label)}${f.req ? '<span class="req">*</span>' : ''}${f.unit ? `<span class="muted small">（${f.unit}）</span>` : ''}</label>${inp}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
}
formModal2 = function ({ title, fields, data = {}, onSave, note = '', foot }) {

  fields.forEach(f => f.onchange && $('#f_' + f.k)?.addEventListener('change', f.onchange));
};
const _submit8 = submitForm;
submitForm = function () { _submit8(); const e = $('#formErr'); if (e && e.textContent) { const d = document.querySelector('#modal details.more'); if (d) d.open = true; } };

const _about8 = showAbout;

/* V9：startApp() 移到最後 */

<script>
/* ============================================================
   V9（客戶回饋）：一進來就是首頁大按鈕；側欄只有登入後才出現（不含免登入功能）；
   登出回到首頁；側欄群組可摺疊（點一個、上一個自動收）＋📌固定；☰ 可整個收起側欄
   ============================================================ */
const NAVKEY = 'kmport-nav-v9';
let NAVST = (() => { try { return JSON.parse(localStorage.getItem(NAVKEY)) || {}; } catch (e) { return {}; } })();
NAVST.pins = NAVST.pins || []; if (NAVST.open === undefined) NAVST.open = '進出港作業';
const saveNav = () => { try { localStorage.setItem(NAVKEY, JSON.stringify(NAVST)); } catch (e) {} };
const PUB_GROUP = '公開資訊（免登入）';
const groupOf = v => (NAV.find(([g, items]) => g && items.some(i => i[0] === v)) || [])[0];
function navToggle(g) { if (NAVST.pins.includes(g)) return; NAVST.open = NAVST.open === g ? null : g; saveNav(); renderNav(); }
function navPin(ev, g) { ev.stopPropagation(); const i = NAVST.pins.indexOf(g); if (i >= 0) NAVST.pins.splice(i, 1); else NAVST.pins.push(g); saveNav(); renderNav(); toast(i >= 0 ? `已取消固定「${g}」` : `📌 已固定「${g}」，會一直展開`); }
function navAll(open) { const gs = NAV.filter(([g]) => g && g !== PUB_GROUP).map(([g]) => g); NAVST.pins = open ? gs : []; NAVST.open = null; saveNav(); renderNav(); }
function toggleNav() {
  if (window.innerWidth <= 820) { document.querySelector('nav').classList.toggle('open'); return; }
  document.body.classList.toggle('navhide'); try { localStorage.setItem('kmport-navhide', document.body.classList.contains('navhide') ? '1' : ''); } catch (e) {}
}
try { if (localStorage.getItem('kmport-navhide')) document.body.classList.add('navhide'); } catch (e) {}
renderNav = function () {
  const guest = isGuest();
  document.body.classList.toggle('guest', guest);
  const cur = groupOf(VIEW);
  if (VIEW !== window._navLastView) { window._navLastView = VIEW; if (cur && cur !== PUB_GROUP && !NAVST.pins.includes(cur)) NAVST.open = cur; }   // 換頁時才自動展開所在群組
  if (NAVST.open === PUB_GROUP) NAVST.open = '進出港作業';
  const pc = pendingCount(), sc = (S.services || []).filter(x => x.status === '待審').length;
  const badge = id => (id === 'apply' || id === 'review') && pc && isStaff() ? pc : id === 'service' && sc && isStaff() ? sc : (id === 'apply' && pc && !isStaff() ? pc : 0);

  NAV.forEach(([g, items]) => {

// 原本 render() 會依文字再補徽章；V9 已在 renderNav 內處理，這裡去掉重複

/* ============================================================

const pshipDir = d => `<span class="dir10 ${d}">${d === 'in' ? '進港' : '出港'}</span>`;
VIEWS.pships = () => {
  const all = pshipRows(PSH.day), n = d => all.filter(r => r.d === d).length;

  return pubTitle('進出港船舶', '已核准的預定進港與預定出港，點一列看完整資料') + `<div class="bar bar10">
    <div class="seg lg">${[['今天', 0], ['明天', 1], ['後天', 2]].map(([t, o]) => `<a class="${PSH.day === o ? 'on' : ''}" onclick="PSH.day=${o};render()">${t}</a>`).join('')}</div>
    <div class="seg lg">${dirs.map(([k, t, c]) => `<a class="${PSH.dir === k ? 'on' : ''}" onclick="PSH.dir='${k}';render()">${t} ${c}</a>`).join('')}</div>
    <b>${fmtD(dayStart(PSH.day))}</b></div>
  <div class="card"><div class="tbl"><table class="t10"><tr><th>時間</th><th>進／出</th><th>船名</th><th>來自／前往</th><th>船席</th><th>狀態</th><th></th></tr>
  ${rows.map(r => { const v = r.v; return `<tr class="click10" onclick="pshipInfo('${v.id}')"><td><b>${fmtT(r.t)}</b></td><td>${pshipDir(r.d)}</td><td><b>${esc(ship(v.shipId).name)}</b></td><td>${esc(r.d === 'in' ? v.prevPort : v.nextPort)}</td><td>${esc(berth(v.berthId)?.name || (r.d === 'in' ? '待指泊' : '—'))}</td><td>${pshipStatus(r)}</td><td class="muted">›</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">這天沒有船舶</td></tr>'}</table></div></div>`;
};
function pshipInfo(id) {
  const v = voy(id), s = ship(v.shipId), lv = appsOf(v.id, '出港').find(x => x.status === '通過');
  const item = (k, val) => `<div class="i10"><span>${k}</span><b>${val || '—'}</b></div>`;
  modal(esc(s.name), `<div class="info10">
