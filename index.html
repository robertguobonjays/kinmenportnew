<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新港埠系統 DEMO</title>
<style>
:root{--navy:#14325c;--navy2:#1f4e8c;--bg:#f2f5f9;--card:#fff;--line:#dde3ec;--text:#1d2733;--muted:#677485;--green:#2e9d5b;--yellow:#d99a00;--red:#d64545;--blue:#2f6fd6;--gray:#98a3b0;--soft:#eef3fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .logo{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .demo{background:#f5b301;color:#222;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:700}
header .sp{flex:1}
header select{background:#24467a;color:#fff;border:1px solid #4a6c9e;border-radius:6px;padding:5px 8px;max-width:230px}
header .hbtn{background:transparent;color:#fff;border:1px solid #4a6c9e;border-radius:6px;padding:5px 10px;cursor:pointer}
#menuBtn{display:none}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
nav{background:#fff;border-right:1px solid var(--line);padding:10px 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav .grp{font-size:12px;color:var(--muted);padding:12px 18px 4px}
nav a{display:flex;align-items:center;gap:8px;padding:9px 18px;color:var(--text);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--soft);border-left-color:var(--navy2);color:var(--navy2);font-weight:700}
nav a .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
main{padding:18px 22px 60px;min-width:0}
.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.title h2{margin:0;font-size:20px}
.title .sub{color:var(--muted);font-size:13px}
.title .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy2)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.warn .n{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*,.mapwrap>*{min-width:0}
.card>table{display:block;overflow-x:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy2)}
.btn.p{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.r{background:#fff;border-color:#e7b4b4;color:var(--red)}
.btn.s{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.bar select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.tbl{width:100%;overflow:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#f6f8fb;font-size:13px;color:#3d4a5a;white-space:nowrap;position:sticky;top:0}
tr:hover td{background:#fafcff}
td.num,th.num{text-align:right}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;white-space:nowrap}
.t-wait{background:#fff4d6;color:#8a6200}.t-ok{background:#e0f3e8;color:#1d6b3e}.t-no{background:#fde4e4;color:#a12f2f}
.t-cancel{background:#eceff3;color:#5a6573;text-decoration:line-through}.t-info{background:#e3edfb;color:#1f4e8c}.t-gray{background:#eceff3;color:#5a6573}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{background:#fffbe8;border:1px solid #f1e2a6;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs a.on{border-bottom-color:var(--navy2);color:var(--navy2);font-weight:700}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:30px 12px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;width:min(720px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox.wide{width:min(980px,100%)}
.mhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mhead h3{margin:0;font-size:16px;flex:1}
.mbody{padding:16px 18px;max-height:70vh;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .f.full{grid-column:1/-1}
.form label{font-size:13px;color:#3d4a5a}
.form label .req{color:var(--red)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
.form .hint{font-size:12px;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk label{display:flex;gap:4px;align-items:center;color:var(--text)}
#toast{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1d2733;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:360px;font-size:13px;animation:fin .2s}
.toast.ok{background:#1f6f45}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
/* map */
.mapwrap{display:grid;grid-template-columns:1fr 320px;gap:14px}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;position:relative}
.mapbox svg{width:100%;height:auto;display:block;border-radius:6px}
.berth{cursor:pointer}
.berth:hover rect.b{stroke:#fff;stroke-width:3}
.berth.sel rect.b{stroke:#ffeb3b;stroke-width:4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding:6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.crumb{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:13px}
.crumb a{color:var(--navy2);cursor:pointer;text-decoration:underline}
.region{cursor:pointer}
.region:hover circle{fill:#ffd54f}
/* moving board */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{background:#eef2f7;border-radius:10px;padding:10px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:14px;display:flex;gap:6px;align-items:center}
.vcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.vcard .nm{font-weight:700}
.vcard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.step{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;cursor:pointer;background:#fff}
.step.on{background:#e3edfb;border-color:#9dbbe9;color:#1f4e8c}
/* LED */
.led{background:#050505;border-radius:8px;padding:14px;color:#ffb000;font-family:"Microsoft JhengHei",monospace;min-height:260px;overflow:hidden;border:6px solid #222}
.led .lh{display:flex;justify-content:space-between;color:#fff;border-bottom:1px solid #333;padding-bottom:6px;margin-bottom:6px}
.led table{background:transparent}
.led th,.led td{border-bottom:1px solid #1d1d1d;background:transparent!important;color:inherit;padding:4px 6px}
.led th{color:#7fd3ff;position:static}
.marq{overflow:hidden;white-space:nowrap;border-top:1px solid #333;margin-top:8px;padding-top:6px;color:#4cff7a}
.marq span{display:inline-block;padding-left:100%;animation:mq 18s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chart svg{width:100%;height:auto}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.json{background:#0f1b2b;color:#cde3ff;border-radius:8px;padding:12px;font-family:Consolas,monospace;font-size:12px;overflow:auto;max-height:420px;white-space:pre}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:1100px){.mapwrap{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  #menuBtn{display:inline-block}
  .layout{grid-template-columns:1fr}
  nav{position:fixed;left:-260px;top:56px;width:250px;z-index:70;transition:left .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  nav.open{left:0}
  main{padding:14px 12px 60px}
  header{gap:8px;padding:0 10px}
  header h1{font-size:14px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  header .sp,header .logo,header .demo,#dateLbl{display:none}
  header .hbtn{padding:4px 7px;font-size:12px}
  .form{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  th,td{padding:6px 5px;font-size:13px}
  header select{max-width:118px;font-size:12px;padding:4px}
  .title .sp{display:none}
}
@media print{header,nav,.bar,.btn,.tabs,#toast{display:none!important}.layout{display:block}main{padding:0}.card{border:none}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="menuBtn" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
  <div class="logo">⚓</div>
  <h1>金門港 新港埠資訊系統</h1><span class="demo">DEMO</span>
  <div class="sp"></div>
  <span id="dateLbl" class="small"></span>
  <select id="userSel" title="切換登入身分（展示權限控管）"></select>
  <button class="hbtn" onclick="resetDemo()" title="清除所有修改，回到初始展示資料">重設資料</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================================================
   新港埠系統 DEMO V1
   - 資料存在瀏覽器（localStorage），「重設資料」可回到初始狀態
   - 所有資料皆為展示用模擬資料
   ============================================================ */
const KEY = 'kmport-demo-v1';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const money = n => (Math.round(n * 10) / 10).toLocaleString('zh-TW');
const dayStart = (off = 0) => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + off); return d.getTime(); };
const at = (off, hh = 0, mm = 0) => dayStart(off) + hh * 3600e3 + mm * 60e3;
const fmtD = t => { if (!t) return ''; const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtT = t => { if (!t) return ''; const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmt = t => t ? `${fmtD(t)} ${fmtT(t)}` : '';
const fmtS = t => { if (!t) return ''; const d = new Date(t); return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${fmtT(t)}`; };
const toInput = t => t ? `${fmtD(t)}T${fmtT(t)}` : '';
const fromInput = s => s ? new Date(s).getTime() : null;
const roc = t => new Date(t).getFullYear() - 1911;
const WEEK = ['日','一','二','三','四','五','六'];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ------------------------------------------------------------ seed data */
function seed() {
  const R = rng(20261015);
  const ships = [
    ['JX06','金星6號','小三通客船','金安航運股份有限公司',480,'中華民國',3518],
    ['XDF','新東方','小三通客船','坤龍航運股份有限公司',650,'中華民國',2738],
    ['MKPL1','馬可波羅1號','小三通客船','大榮海運股份有限公司',720,'中華民國',3925],
    ['XJXL','新金祥龍','小三通客船','金廈海運股份有限公司',450,'中華民國',2458],
    ['HPXX','和平新星','小三通客船','和平船務代理有限公司',800,'中華人民共和國',1405],
    ['BF','八方','小三通客船','海西企業股份有限公司',400,'中華人民共和國',4457],
    ['XA','迅安','小三通客船','南星航運股份有限公司',600,'中華民國',3814],
    ['XWY','新武夷','小三通客船','全國船務代理有限公司',550,'中華人民共和國',3866],
    ['DZ','大中','貨船','港勤有限公司',1800,'中華民國',1038],
    ['DQ','大勤','貨船','港勤有限公司',1500,'中華民國',493],
    ['MK1','麥克1號','自用小船','李大海',12,'中華民國',412],
    ['XL8','鑫隆8號','自用小船','王小舟',15,'中華民國',306],
    ['XUA','旭安','遊艇','金海遊艇有限公司',35,'中華民國',199],
    ['WXR','外星人','遊艇','金海遊艇有限公司',28,'中華民國',118],
    ['YMZ','漁滿載888號','漁船','張漁民',60,'中華民國',1446],
  ].map(s => ({ id: uid(), code: s[0], name: s[1], type: s[2], company: s[3], gt: s[4], nation: s[5], cum: s[6], phone: '082-3' + Math.floor(R() * 89999 + 10000) }));
  const berths = [
    {id:'S1L',name:'S1左',type:'小三通客輪',cap:1,x:276,y:178,w:40,h:150},
    {id:'S1R',name:'S1右',type:'小三通客輪',cap:1,x:344,y:178,w:40,h:150},
    {id:'S2L',name:'S2左',type:'小三通客輪',cap:1,x:426,y:178,w:40,h:150},
    {id:'S2R',name:'S2右',type:'小三通客輪',cap:1,x:494,y:178,w:40,h:150},
    {id:'S3L',name:'S3左',type:'小三通客輪',cap:1,x:576,y:178,w:40,h:150},
    {id:'S3R',name:'S3右',type:'小三通客輪',cap:1,x:644,y:178,w:40,h:150},
    {id:'S4',name:'S4',type:'一般',cap:1,x:160,y:160,w:96,h:34},
    {id:'NB',name:'北堤',type:'一般',cap:1,x:128,y:300,w:40,h:120},
    {id:'SB',name:'南堤',type:'一般',cap:1,x:590,y:486,w:140,h:34},
    {id:'CG',name:'貨運碼頭',type:'貨船',cap:1,x:748,y:196,w:46,h:180},
    {id:'EB',name:'水頭東側泊區',type:'小船泊區',cap:6,x:846,y:440,w:128,h:52},
    {id:'EY',name:'東側遊憩碼頭',type:'遊艇',cap:4,x:846,y:512,w:128,h:42},
  ].map(b => ({ ...b, port: '水頭', note: '' }));
  const ports = [
    {id:uid(),name:'水頭',code:'A33',region:'金門',phase:'第一期',status:'建置中'},
    {id:uid(),name:'料羅',code:'A32',region:'金門',phase:'第二期',status:'規劃中'},
    {id:uid(),name:'九宮',code:'A34',region:'金門',phase:'後續擴充',status:'規劃中'},
    {id:uid(),name:'羅厝漁港',code:'A38',region:'金門',phase:'後續擴充',status:'規劃中'},
    {id:uid(),name:'澎湖',code:'A37',region:'澎湖',phase:'後續擴充',status:'規劃中'},
  ];
  const byCode = c => ships.find(s => s.code === c);
  const voyages = [];
  const seqYear = {};
  function addV(code, inT, outT, o = {}) {
    const s = byCode(code); s.cum++;
    const y = roc(inT); seqYear[code + y] = (seqYear[code + y] || Math.floor(s.cum * 0.27)) + 1;
    voyages.push(Object.assign({
      id: uid(), shipId: s.id, code: `${s.code}-${y}-${pad(seqYear[code + y]).padStart(4,'0')}`, cum: s.cum,
      inTime: inT, outTime: outT, prevPort: s.type === '小三通客船' ? (code === 'BF' ? '石井' : '五通') : (s.type === '貨船' ? '高雄' : '水頭東側泊區'),
      nextPort: s.type === '小三通客船' ? (code === 'BF' ? '石井' : '五通') : (s.type === '貨船' ? '高雄' : '水頭東側泊區'),
      berthId: '', status: '通過', move: '預報', actualIn: null, actualOut: null, steps: [], pax: 0, remark: '', applicant: s.company, created: inT - 2 * 864e5
    }, o));
  }
  const ferries = ['JX06','MKPL1','XJXL','HPXX','BF','XA','XWY'];
  const fBerth = {JX06:'S1L',MKPL1:'S1R',XJXL:'S2L',HPXX:'S2R',BF:'S3L',XA:'S3R',XWY:'S2R'};
  // 過去 45 天已完成航次（供計費、月結）
  for (let d = -45; d <= -1; d++) {
    ferries.forEach((c, i) => {
      const h = 8 + (i % 6), m = (i * 20) % 60;
      const inT = at(d, h, m), outT = inT + (60 + Math.floor(R() * 50)) * 60e3;
      addV(c, inT, outT, { berthId: fBerth[c], move: '已出港', actualIn: inT + Math.floor(R() * 10) * 60e3, actualOut: outT + Math.floor(R() * 15) * 60e3, steps: ['VHF報到','通過堤口'] });
    });
    if (d % 3 === 0) ['MK1','XL8','XUA'].forEach((c, i) => { const inT = at(d, 7 + i, 0), outT = inT + (3 + i) * 3600e3; addV(c, inT, outT, { berthId: c === 'XUA' ? 'EY' : 'EB', move: '已出港', actualIn: inT, actualOut: outT }); });
    if (d % 4 === 0) { const inT = at(d, 6, 30), outT = at(d, 21, 0); addV(d % 8 === 0 ? 'DZ' : 'DQ', inT, outT, { berthId: 'CG', move: '已出港', actualIn: inT, actualOut: outT }); }
  }
  // 今天
  addV('JX06', at(0,8,0), at(0,8,30), {berthId:'S1L', move:'已出港', actualIn: at(0,7,58), actualOut: at(0,8,31), steps:['VHF報到','通過堤口']});
  addV('MKPL1', at(0,9,0), at(0,9,30), {berthId:'S1R', move:'已出港', actualIn: at(0,8,55), actualOut: at(0,9,26)});
  addV('XA', at(0,9,30), at(0,11,30), {berthId:'S3R', move:'靠泊', actualIn: at(0,9,33), steps:['VHF報到','通過3浬','通過堤口']});
  addV('HPXX', at(0,10,30), at(0,13,30), {berthId:'S2R', move:'靠泊', actualIn: at(0,10,31), steps:['VHF報到']});
  addV('JX06', at(0,10,30), at(0,12,30), {berthId:'S1L', move:'靠泊', actualIn: at(0,10,42)});
  addV('BF', at(0,12,10), at(0,13,30), {berthId:'S3L'});
  addV('XWY', at(0,13,0), at(0,14,0), {berthId:''});
  addV('XJXL', at(0,14,0), at(0,15,0), {berthId:'S2L'});

  const m = { '待審':'t-wait','通過':'t-ok','退回':'t-no','停航取消':'t-cancel','預報':'t-info','靠泊':'t-ok','已出港':'t-gray','正常':'t-ok','延誤':'t-wait','停航':'t-no','未繳':'t-wait','已繳':'t-ok','在線':'t-ok','離線':'t-no' };

function toast(msg, cls = '') { const d = document.createElement('div'); d.className = 'toast ' + cls; d.innerHTML = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3800); }
function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(c => { const s = String(c ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function rateOf(gt) { const r = S.rates.find(x => x.item === '碇泊費' && gt >= x.min && gt < x.max); return r ? r.rate : 0; }
function feeOf(v) {
  if (['停航取消','退回','待審'].includes(v.status)) return { hours: 0, berth: 0, garbage: 0, total: 0 };
  const s = ship(v.shipId); const a = v.actualIn || v.inTime, b = v.actualOut || v.outTime;
  const hours = Math.max(1, Math.ceil((b - a) / 3600e3));
  const berthFee = hours * rateOf(s.gt);
  const g = S.otherFees.filter(f => f.item === '垃圾清理費');
  const garbage = s.gt < 500 ? (g[0]?.amount || 0) : (g[1]?.amount || 0);
  return { hours, berth: berthFee, garbage, total: berthFee + garbage };
}
function berthState(b) {
  const today0 = dayStart(0), today1 = dayStart(1);
  const occ = S.voyages.filter(v => v.berthId === b.id && v.move === '靠泊' && v.status === '通過');
  const sch = S.voyages.filter(v => v.berthId === b.id && v.move === '預報' && v.status === '通過' && v.inTime >= today0 && v.inTime < today1);
  return { occ, sch, state: occ.length >= b.cap ? 'full' : occ.length ? 'part' : sch.length ? 'sch' : 'free' };
}
function nextCode(s, t) {
  const pre = `${s.code}-${roc(t)}-`;
  const mx = Math.max(0, ...S.voyages.filter(v => v.code.startsWith(pre)).map(v => +v.code.slice(pre.length) || 0));
  return pre + String(mx + 1).padStart(4, '0');
}

function modal(title, body, foot = '', wide = false) {
  $('#modal').innerHTML = `<div class="mbox ${wide ? 'wide' : ''}"><div class="mhead"><h3>${title}</h3><button class="btn s" onclick="closeModal()">✕</button></div><div class="mbody">${body}</div><div class="mfoot">${foot || '<button class="btn" onclick="closeModal()">關閉</button>'}</div></div>`;
  $('#modal').classList.add('on');
}
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
let FORM = null;
function formModal({ title, fields, data = {}, onSave, wide = false, note = '' }) {
  FORM = { fields, onSave };
  const h = fields.map(f => {
    const v = data[f.k] ?? f.def ?? '';
    const req = f.req ? '<span class="req">*</span>' : '';
    let inp;
    const dis = f.ro ? 'disabled' : '';
    if (f.type === 'select') inp = `<select id="f_${f.k}" ${dis}>${(f.opts || []).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
    else if (f.type === 'textarea') inp = `<textarea id="f_${f.k}" rows="3" ${dis}>${esc(v)}</textarea>`;
    else if (f.type === 'datetime') inp = `<input id="f_${f.k}" type="datetime-local" value="${toInput(v)}" ${dis}>`;
    else if (f.type === 'checks') inp = `<div class="chk" id="f_${f.k}">${f.opts.map(o => `<label><input type="checkbox" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div>`;
    else inp = `<input id="f_${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${dis}>`;
    return `<div class="f ${f.full ? 'full' : ''}"><label>${esc(f.label)}${req}</label>${inp}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
  }).join('');
  modal(title, (note ? `<div class="note">${note}</div>` : '') + `<div class="form">${h}</div><div id="formErr" style="color:var(--red);margin-top:10px"></div>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="submitForm()">儲存</button>`, wide);
  fields.forEach(f => f.onchange && $('#f_' + f.k)?.addEventListener('change', f.onchange));
}
function readForm() {
  const o = {};
  FORM.fields.forEach(f => {
    const el = $('#f_' + f.k); if (!el) return;
    if (f.type === 'datetime') o[f.k] = fromInput(el.value);
    else if (f.type === 'number') o[f.k] = el.value === '' ? '' : Number(el.value);
    else if (f.type === 'checks') o[f.k] = [...el.querySelectorAll('input:checked')].map(i => i.value);
    else o[f.k] = el.value.trim();
  });
  return o;
}
function submitForm() {
  const o = readForm();
  const miss = FORM.fields.filter(f => f.req && (o[f.k] === '' || o[f.k] == null));
  if (miss.length) { $('#formErr').textContent = '請填寫：' + miss.map(f => f.label).join('、'); return; }
  const err = FORM.onSave(o);
  if (err) { $('#formErr').textContent = err; return; }
  save(); closeModal(); render();
}

/* ---------------- 港區調度（空拍圖） */
let MAPSEL = null, MAPLV = 'harbor';
function aerialSVG() {

  for (let i = 0; i < 40; i++) { const x = 820 + R() * 180, y = 150 + R() * 270; tex += `<rect x="${x}" y="${y}" width="${8 + R() * 20}" height="${6 + R() * 16}" fill="hsl(${30 + R() * 30},12%,${58 + R() * 20}%)"/>`; }
  for (let i = 0; i < 60; i++) { const x = R() * 1000, y = R() * 135; tex += `<circle cx="${x}" cy="${y}" r="${4 + R() * 8}" fill="hsl(${95 + R() * 30},35%,${28 + R() * 14}%)" opacity=".85"/>`; }
  let waves = ''; for (let i = 0; i < 90; i++) { const x = R() * 1000, y = 160 + R() * 470; waves += `<path d="M${x} ${y} q8 -4 16 0" stroke="#ffffff" stroke-opacity=".18" fill="none"/>`; }
  let parking = ''; for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) parking += `<rect x="${662 + c * 15}" y="${36 + r * 22}" width="11" height="17" fill="${R() < .6 ? ['#c33','#eee','#246','#888','#dd3'][Math.floor(R() * 5)] : 'none'}" stroke="#ddd" stroke-width=".6"/>`;
  const berths = S.berths.filter(b => b.port === '水頭' && b.x != null).map(b => {
    const st = berthState(b); const col = { free: '#2e9d5b', sch: '#e0a100', part: '#e07b00', full: '#d64545' }[st.state];
    const vert = b.h > b.w;

  }).join('');
  return `<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7fa8"/><stop offset="1" stop-color="#174f78"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbbd94"/><stop offset="1" stop-color="#e3d6ad"/></linearGradient></defs>
  <rect width="1000" height="640" fill="url(#sea)"/>${waves}
  <path d="M0 0 H1000 V430 H820 V150 Q700 160 600 150 Q450 140 300 152 Q180 158 120 148 Q60 140 0 160 Z" fill="#7d8f63"/>
  <path d="M0 160 Q60 140 120 148 Q180 158 300 152 Q450 140 600 150 Q700 160 820 150 V430 H812 V160 Q700 168 600 158 Q450 148 300 160 Q180 166 120 156 Q60 150 0 168Z" fill="url(#sand)"/>
  ${tex}
  <path d="M0 120 L1000 110" stroke="#bfb9ad" stroke-width="10"/><path d="M500 0 V120" stroke="#bfb9ad" stroke-width="8"/><path d="M880 110 V420" stroke="#bfb9ad" stroke-width="8"/>
  <rect x="370" y="30" width="250" height="80" fill="#e9ecef" stroke="#9aa" /><rect x="380" y="40" width="230" height="60" fill="#cfd8dc"/><text x="495" y="76" text-anchor="middle" font-size="14" fill="#33424f" font-weight="700">旅客服務中心</text>
  <rect x="655" y="28" width="150" height="80" fill="#5f6b73" opacity=".7"/>${parking}<text x="730" y="23" text-anchor="middle" font-size="11" fill="#fff">停車場</text>
  <path d="M150 150 L92 330 L240 470" stroke="#9c9c9c" stroke-width="22" fill="none" stroke-linejoin="round"/><path d="M150 150 L92 330 L240 470" stroke="#bdbdbd" stroke-width="12" fill="none" stroke-dasharray="4 3"/>

  <rect x="800" y="190" width="22" height="195" fill="#c9c2b0"/>

  <text x="395" y="600" text-anchor="middle" font-size="13" fill="#e3f2ff" font-weight="700">港口出入口 ⇣</text>

function shipIcon(b, v, i, vert) {
  const s = ship(v.shipId); const col = s.type === '小三通客船' ? '#f4f6f8' : s.type === '貨船' ? '#e2b04a' : s.type === '遊艇' ? '#fff' : '#8fd3ff';
  if (b.cap > 1) { const x = b.x + 6 + i * 20, y = b.y + 6, h = b.h - 12; return `<path d="M${x} ${y + h} L${x} ${y + 8} Q${x + 7} ${y - 4} ${x + 14} ${y + 8} L${x + 14} ${y + h}Z" fill="${col}" stroke="#333" stroke-width="1"><title>${esc(s.name)}</title></path>`; }
  if (vert) { const x = b.x + 6, y = b.y + 8, w = b.w - 12, h = b.h - 16;
    return `<path d="M${x} ${y + 18} Q${x + w / 2} ${y - 12} ${x + w} ${y + 18} L${x + w} ${y + h} L${x} ${y + h}Z" fill="${col}" stroke="#333"/><rect x="${x + 5}" y="${y + 40}" width="${w - 10}" height="${h - 70}" fill="#9fb4c7" rx="3"/><text x="${x + w / 2}" y="${y + h / 2 + 20}" font-size="10" text-anchor="middle" fill="#0b2a4a" transform="rotate(-90 ${x + w / 2} ${y + h / 2 + 20})">${esc(s.name)}</text>`; }
  const x = b.x + 6, y = b.y + 6, w = b.w - 12, h = b.h - 12;
  return `<path d="M${x} ${y} L${x + w - 18} ${y} Q${x + w + 8} ${y + h / 2} ${x + w - 18} ${y + h} L${x} ${y + h}Z" fill="${col}" stroke="#333"/><text x="${x + w / 2 - 6}" y="${y + h / 2 + 4}" font-size="10" text-anchor="middle" fill="#0b2a4a">${esc(s.name)}</text>`;
}

VIEWS.map = () => {

function selBerth(id) { MAPSEL = id; render(); }

  }
  const b = berth(MAPSEL); if (!b) return '';

  <b>目前靠泊</b>${st.occ.map(v => `<div class="vcard"><div class="nm">${esc(ship(v.shipId).name)} <span class="muted small">${v.code}</span></div><div class="small muted">實際進港 ${fmtS(v.actualIn)}｜預定出港 ${fmtS(v.outTime)}</div>

function assign(vid, bid) {
  const v = S.voyages.find(x => x.id === vid); if (!v) return;
  v.berthId = bid; log('指派泊位', `${ship(v.shipId).name} ${v.code}`, bid ? `→ ${berth(bid).name}` : '取消指派'); save(); render();
  toast(bid ? `已將 ${esc(ship(v.shipId).name)} 指派到 ${esc(berth(bid).name)}，並同步更新 LED 與售票登船資訊` : '已取消指派');
}
function arrive(vid, bid) {
  const v = S.voyages.find(x => x.id === vid); if (!v) return;
  if (bid) v.berthId = bid;
  const b = berth(v.berthId); if (!b) { toast('請先指派泊位'); return; }
  if (berthState(b).occ.length >= b.cap) { toast(`⚠️ ${esc(b.name)} 已滿，請先指派其他泊位`); return; }
  v.move = '靠泊'; v.actualIn = Date.now(); log('靠泊', `${ship(v.shipId).name} ${v.code}`, b.name); save(); render(); toast(`${esc(ship(v.shipId).name)} 已靠泊 ${esc(b.name)}`, 'ok');
}
function depart(vid) {
  const v = S.voyages.find(x => x.id === vid); if (!v) return;
  v.move = '已出港'; v.actualOut = Date.now(); const f = feeOf(v);
  log('出港', `${ship(v.shipId).name} ${v.code}`, `自動結案，碇泊費 ${f.berth}、垃圾清理費 ${f.garbage}`); save(); render();
  toast(`${esc(ship(v.shipId).name)} 已出港，航次自動結案；計費 ${money(f.total)} 元`, 'ok');
}
function moveBerth(vid, bid) {
  if (!bid) return; const v = S.voyages.find(x => x.id === vid); const b = berth(bid);
  if (berthState(b).occ.length >= b.cap) { toast(`⚠️ ${esc(b.name)} 已滿`); render(); return; }
  const from = berth(v.berthId)?.name; v.berthId = bid; log('移泊', `${ship(v.shipId).name} ${v.code}`, `${from} → ${b.name}`); MAPSEL = bid; save(); render(); toast(`已移泊：${esc(from)} → ${esc(b.name)}`, 'ok');
}

function selAll(on) { visibleVoyages().filter(v => v.status === '待審').forEach(v => on ? AP.sel.add(v.id) : AP.sel.delete(v.id)); render(); }

function importApply() {

function doImport(sample) {
  const finish = text => {
    const lines = text.split(/\r?\n/).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, ''))).filter(l => l.length >= 5 && l[0] && !l[0].startsWith('船名'));
    let ok = 0, bad = [];
    lines.forEach((l, i) => {
      const s = visibleShips().find(x => x.name === l[0]); const a = Date.parse(l[1].replace(' ', 'T')), b = Date.parse(l[2].replace(' ', 'T'));
      if (!s || isNaN(a) || isNaN(b) || b <= a) { bad.push(`第 ${i + 1} 筆（${esc(l[0])}）`); return; }
      s.cum++;
      S.voyages.push({ id: uid(), shipId: s.id, code: nextCode(s, a), cum: s.cum, inTime: a, outTime: b, prevPort: l[3], nextPort: l[4], berthId: '', status: isStaff() ? '通過' : '待審', move: '預報', actualIn: null, actualOut: null, steps: [], pax: 0, remark: '批次匯入', applicant: me().name, created: Date.now() });
      ok++;
    });
    log('批次匯入申請', `${ok} 筆`, bad.length ? '失敗：' + bad.join('、') : ''); save();
    $('#impRes').innerHTML = `<div class="note">匯入成功 ${ok} 筆${bad.length ? `；檢核未通過 ${bad.length} 筆：${bad.join('、')}（船名不在您的船舶清單或時間格式錯誤）` : ''}</div>`;
    render(); toast(`批次匯入完成：${ok} 筆`, 'ok');
  };
  if (sample) { const s = visibleShips()[0]; if (!s) return; finish([1, 2, 3].map(d => `${s.name},${fmtD(at(d + 1))} 08:30,${fmtD(at(d + 1))} 09:30,五通,五通`).join('\n') + '\n不存在的船,2026-01-01 08:00,2026-01-01 09:00,五通,五通'); return; }
  const f = $('#impFile')?.files[0]; if (!f) { toast('請先選擇檔案'); return; }
  const r = new FileReader(); r.onload = () => finish(r.result); r.readAsText(f, 'utf-8');
}

/* ---------------- 航次管理 */
let VY = { ship: '', from: -3, q: '' };
VIEWS.voyage = () => {

  <div class="note">展示重點（討論第 27 點）：新東方今天有 3 個航次、明天 1 個，若今天停航到明天 11:00 才出港，按「航次異動」直接把第一個航次延後，中間航次自動標記「停航取消」（保留紀錄不刪除），碇泊費依實際時間自動重算。</div>

  <select onchange="VY.from=+this.value;render()">${[[-3, '近 3 天起'], [-7, '近 7 天起'], [-30, '近 30 天起']].map(o => `<option value="${o[0]}" ${VY.from === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
  <button class="btn" onclick="VY.ship=S.ships.find(s=>s.code==='XDF')?.id||'';render()">🔎 看新東方案例</button></div>
  <div class="tbl"><table><tr><th>航次編碼</th><th class="num">累計航次</th><th>船名</th><th>預定進港</th><th>預定出港</th><th>實際進港</th><th>實際出港</th><th>泊位</th><th>狀態</th><th>動態</th><th class="num">計費(元)</th><th></th></tr>
  ${vs.map(v => { const f = feeOf(v); return `<tr style="${v.status === '停航取消' ? 'opacity:.6' : ''}"><td>${v.code}</td><td class="num">${v.cum}</td><td>${esc(ship(v.shipId).name)}</td><td>${fmtS(v.inTime)}</td><td>${fmtS(v.outTime)}</td><td>${fmtS(v.actualIn)}</td><td>${fmtS(v.actualOut)}</td><td>${esc(berth(v.berthId)?.name || '—')}</td><td>${tag(v.status)}${v.remark ? `<div class="small muted">${esc(v.remark)}</div>` : ''}</td><td>${tag(v.move)}</td><td class="num">${f.total ? money(f.total) : '—'}</td>
  <td>${!ro && isStaff() && v.status === '通過' && v.move !== '已出港' ? `<button class="btn s" onclick="openShift('${v.id}')">航次異動</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="12" class="empty">查無資料</td></tr>'}</table></div>`;
};
function openShift(id) {
  const v = S.voyages.find(x => x.id === id); const s = ship(v.shipId);
  const later = S.voyages.filter(x => x.shipId === v.shipId && x.id !== v.id && x.inTime > v.inTime && ['通過','待審'].includes(x.status) && !x.actualIn).sort((a, b) => a.inTime - b.inTime);
  const before = feeOf(v);
  modal(`航次異動：${esc(s.name)} ${v.code}`, `<div class="note">船舶延後出港或停航時使用。新出港時間之前、尚未進港的後續航次會被標記「停航取消」（保留紀錄），費用自動重算。</div>
  <div class="form"><div class="f"><label>原預定出港</label><input disabled value="${fmt(v.outTime)}"></div>
  <div class="f"><label>新的出港時間<span class="req">*</span></label><input type="datetime-local" id="shNew" value="${toInput(later.length ? later[later.length - 1].outTime : v.outTime + 864e5)}" onchange="shiftPreview('${id}')"></div>
  <div class="f"><label>異動原因</label><select id="shReason"><option>天候因素停航</option><option>機械故障</option><option>港口管制</option><option>其他</option></select></div>
  <div class="f"><label>原計費</label><input disabled value="${before.hours} 小時，${money(before.total)} 元"></div></div>
  <h4 style="margin:14px 0 6px">受影響的後續航次</h4><div id="shList"></div>`,

function shiftPreview(id) {
  const v = S.voyages.find(x => x.id === id); const nt = fromInput($('#shNew').value);
  const later = S.voyages.filter(x => x.shipId === v.shipId && x.id !== v.id && x.inTime > v.inTime && ['通過','待審'].includes(x.status) && !x.actualIn).sort((a, b) => a.inTime - b.inTime);
  const aff = later.filter(x => x.inTime < nt);
  const after = feeOf({ ...v, outTime: nt, actualOut: null });
  $('#shList').innerHTML = (aff.length ? `<table><tr><th></th><th>航次</th><th>預定進港</th><th>預定出港</th><th>處理</th></tr>${aff.map(x => `<tr><td><input type="checkbox" class="shChk" value="${x.id}" checked></td><td>${x.code}</td><td>${fmt(x.inTime)}</td><td>${fmt(x.outTime)}</td><td><span class="tag t-cancel">標記停航取消</span></td></tr>`).join('')}</table>` : '<div class="muted">沒有受影響的航次</div>') +
    `<div class="note" style="margin-top:10px">異動後：本航次出港改為 <b>${fmt(nt)}</b>，靠泊 ${after.hours} 小時，碇泊費＋垃圾清理費＝<b>${money(after.total)} 元</b>（航次編碼維持 ${v.code}）</div>`;
}
function applyShift(id) {
  const v = S.voyages.find(x => x.id === id); const nt = fromInput($('#shNew').value); const reason = $('#shReason').value;

  save(); closeModal(); render(); toast(`航次異動完成，${ids.length} 個後續航次已標記停航取消，費用已重算`, 'ok');
}

/* ---------------- 進出港動態 */
VIEWS.moving = () => {
  const ro = !canEdit(); const t0 = dayStart(0), t1 = dayStart(1);
  const vs = visibleVoyages().filter(v => v.status === '通過');
  const a = vs.filter(v => v.move === '預報' && v.inTime < t1 && v.inTime >= dayStart(-1)).sort((x, y) => x.inTime - y.inTime);
  const b = vs.filter(v => v.move === '靠泊').sort((x, y) => x.outTime - y.outTime);
  const c = vs.filter(v => v.move === '已出港' && v.actualOut >= t0).sort((x, y) => y.actualOut - x.actualOut);
  const STEPS = ['VHF報到','通過3浬','通過1浬','下錨','允許進港','通過堤口'];
  const card = (v, kind) => `<div class="vcard"><div class="nm">${esc(ship(v.shipId).name)} <span class="muted small">${v.code}</span></div>
    <div class="small muted">${kind === 'a' ? `預定 ${fmtT(v.inTime)} 進港｜${esc(v.prevPort)}` : kind === 'b' ? `${esc(berth(v.berthId)?.name || '')}｜預定 ${fmtT(v.outTime)} 出港${v.outTime < Date.now() ? ' <span class="tag t-no">逾時</span>' : ''}` : `${fmtT(v.actualOut)} 出港 → ${esc(v.nextPort)}｜已自動結案`}</div>
    ${kind === 'a' ? `<div class="row">${STEPS.map(s => `<span class="step ${v.steps?.includes(s) ? 'on' : ''}" ${ro ? '' : `onclick="toggleStep('${v.id}','${s}')"`}>${s}</span>`).join('')}</div>` : ''}
    ${ro ? '' : `<div class="row">${kind === 'a' ? `<select class="btn s" onchange="arrive('${v.id}',this.value)"><option value="">靠泊到…</option>${S.berths.map(x => `<option value="${x.id}" ${x.id === v.berthId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>${v.berthId ? `<button class="btn g s" onclick="arrive('${v.id}')">靠泊 ${esc(berth(v.berthId).name)}</button>` : ''}` : kind === 'b' ? `<button class="btn r s" onclick="depart('${v.id}')">出港</button><button class="btn s" onclick="openShift('${v.id}')">航次異動</button>` : ''}</div>`}</div>`;
  return `<div class="title"><h2>進出港動態看板</h2><span class="sub">手機可直接操作；出港後自動結案，不再累積未結案資料</span></div>
  <div class="cols"><div class="col"><h4>🕓 預定進港 <span class="tag t-info">${a.length}</span></h4>${a.map(v => card(v, 'a')).join('') || '<div class="empty">無</div>'}</div>
  <div class="col"><h4>⚓ 靠泊中 <span class="tag t-ok">${b.length}</span></h4>${b.map(v => card(v, 'b')).join('') || '<div class="empty">無</div>'}</div>
  <div class="col"><h4>🚀 今日已出港 <span class="tag t-gray">${c.length}</span></h4>${c.map(v => card(v, 'c')).join('') || '<div class="empty">無</div>'}</div></div>`;
};
function toggleStep(id, s) { const v = S.voyages.find(x => x.id === id); v.steps = v.steps || []; v.steps.includes(s) ? v.steps.splice(v.steps.indexOf(s), 1) : v.steps.push(s); log('動態回報', `${ship(v.shipId).name} ${v.code}`, s); save(); render(); }

/* ---------------- 港務台日誌 */
let DL = { off: 0, kind: '小三通' };
VIEWS.dutylog = () => {
  const t0 = dayStart(DL.off), t1 = dayStart(DL.off + 1); const key = fmtD(t0) + DL.kind;
  const kinds = { '小三通': ['小三通客船'], '水頭用': ['貨船','漁船','遊艇','自用小船'] };

  ${vs.map(v => { const s = ship(v.shipId); return `<tr><td>${s.nation === '中華民國' ? '中華民國' : '中華人民共和國'}</td><td>${esc(s.name)}</td><td>${esc(v.prevPort)}</td><td>${fmtT(v.inTime)}</td><td>${fmtT(v.actualIn)}</td><td class="num">${paxFor(v, '入境')}</td><td>${fmtT(v.outTime)}</td><td>${fmtT(v.actualOut)}</td><td class="num">${paxFor(v, '出境')}</td><td>${esc(v.nextPort)}</td><td>${esc(v.remark || '')}</td></tr>`; }).join('') || '<tr><td colspan="11" class="empty">當日無資料</td></tr>'}

};
function exportDuty() { const t = $('#view table'); const rows = [...t.rows].map(r => [...r.cells].map(c => c.innerText)); downloadCSV(`港務台日誌_${fmtD(dayStart(DL.off))}_${DL.kind}.csv`, rows); }

/* ---------------- 小三通航班 */
let FL = { off: 0 };
VIEWS.flight = () => {
  const ro = !canEdit(); const t0 = dayStart(FL.off), t1 = dayStart(FL.off + 1);
  const fl = S.flights.filter(f => f.time >= t0 && f.time < t1).sort((a, b) => a.time - b.time);
  const gates = ['1號登船口','2號登船口','3號登船口'];

  return `<div class="title"><h2>小三通航班</h2><span class="sub">航班、登船口與售票系統同步；人數由售票劃位系統帶入（不含個資）</span><div class="sp"></div>
  ${ro ? '' : `<button class="btn p" onclick="editFlight()">＋ 新增航班</button><button class="btn" onclick="syncTicket()">⟳ 售票系統同步人數</button><button class="btn" onclick="pdfCheck()">📄 航港局航班表勾稽</button>`}</div>
  <div class="bar"><button class="btn" onclick="FL.off--;render()">‹ 前一天</button><b>${fmtD(t0)}（${WEEK[new Date(t0).getDay()]}）</b><button class="btn" onclick="FL.off++;render()">後一天 ›</button><button class="btn" onclick="FL.off=0;render()">今天</button>
  <span class="sp"></span><span>出境 <b>${sum('出境').toLocaleString()}</b> 人｜入境 <b>${sum('入境').toLocaleString()}</b> 人｜航班 ${fl.length} 班</span></div>
  <div class="tbl"><table><tr><th>時間</th><th>船舶</th><th>航線</th><th>方向</th><th>登船口</th><th>狀態</th><th class="num">人數／容量</th><th class="num">載客率</th><th></th></tr>
  ${fl.map(f => `<tr><td><b>${fmtT(f.time)}</b></td><td>${esc(ship(f.shipId).name)}</td><td>${esc(f.from)} → ${esc(f.to)}</td><td>${f.dir}</td>
  <td>${ro || f.dir === '入境' ? esc(f.dir === '入境' ? '—' : f.gate) : `<select class="btn s" onchange="setGate('${f.id}',this.value)">${gates.map(g => `<option ${g === f.gate ? 'selected' : ''}>${g}</option>`).join('')}</select>`}</td>
  <td>${tag(f.status)}${f.reason ? `<div class="small muted">${esc(f.reason)}</div>` : ''}</td><td class="num">${f.pax} / ${f.cap}</td><td class="num">${f.cap ? Math.round(f.pax / f.cap * 100) : 0}%</td>
  <td style="white-space:nowrap">${ro ? '' : `<button class="btn s" onclick="editFlight('${f.id}')">編輯</button><button class="btn r s" onclick="delFlight('${f.id}')">刪除</button>`}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">當日無航班</td></tr>'}</table></div>`;
};
function setGate(id, g) { const f = S.flights.find(x => x.id === id); f.gate = g; log('登船口設定', `${fmtS(f.time)} ${ship(f.shipId).name}`, g); save(); toast(`登船口已改為 ${g}，已同步至售票系統與 LED 看板（模擬）`, 'ok'); }
function editFlight(id) {
  const f0 = id ? S.flights.find(f => f.id === id) : null;
  const ferries = S.ships.filter(s => s.type === '小三通客船').map(s => [s.id, s.name]);
  formModal({ title: id ? '編輯航班' : '新增航班', data: f0 || { time: at(FL.off, 9), from: '金門', to: '五通', cap: 300, status: '正常', gate: '1號登船口' },
    fields: [
      { k: 'time', label: '開航時間', type: 'datetime', req: true }, { k: 'shipId', label: '船舶', type: 'select', opts: ferries, req: true },
      { k: 'from', label: '出發港', type: 'select', opts: ['金門','五通','石井','廈門','泉州'], req: true }, { k: 'to', label: '抵達港', type: 'select', opts: ['五通','石井','廈門','泉州','金門'], req: true },
      { k: 'gate', label: '登船口', type: 'select', opts: ['1號登船口','2號登船口','3號登船口'] }, { k: 'status', label: '狀態', type: 'select', opts: ['正常','延誤','停航'] },
      { k: 'cap', label: '容量（人）', type: 'number', req: true }, { k: 'reason', label: '異動原因', type: 'text' },
    ],
    onSave: o => {
      if (o.from === o.to) return '出發港與抵達港不可相同';
      o.dir = o.from === '金門' ? '出境' : '入境';
      if (f0) { Object.assign(f0, o); log('修改航班', `${fmtS(o.time)} ${ship(o.shipId).name}`); }
      else { S.flights.push({ id: uid(), pax: 0, ...o }); log('新增航班', `${fmtS(o.time)} ${ship(o.shipId).name}`); }
      toast('已儲存，並同步至售票系統與 LED（模擬）', 'ok');
    } });
}
function delFlight(id) { const f = S.flights.find(x => x.id === id); if (!confirm(`刪除 ${fmtS(f.time)} ${ship(f.shipId).name} 航班？`)) return; S.flights = S.flights.filter(x => x.id !== id); log('刪除航班', `${fmtS(f.time)} ${ship(f.shipId).name}`); save(); render(); }
function syncTicket() {
  const R = rng(Date.now() % 100000); const t0 = dayStart(FL.off), t1 = dayStart(FL.off + 1); let n = 0;
  S.flights.filter(f => f.time >= t0 && f.time < t1 && f.status !== '停航').forEach(f => { f.pax = Math.max(f.pax, Math.floor(f.cap * (0.3 + R() * 0.6))); n++; });
  log('售票系統同步', fmtD(t0), `更新 ${n} 班人數`); save(); render(); toast(`已自售票劃位系統取得 ${n} 班旅客人數（僅統計數字，不含個資）`, 'ok');
}
function pdfCheck() {
  modal('航港局小三通航班表勾稽', `<p>上傳航港局公告的小三通航班表 PDF，系統解析後與本系統航班比對。</p>
  <div class="flex"><input type="file" id="pdfF" accept=".pdf"><button class="btn p" onclick="runPdf()">開始勾稽</button><button class="btn" onclick="runPdf(true)">使用範例公告</button></div><div id="pdfRes" style="margin-top:12px"></div>`, '', true);
}
function runPdf(sample) {
  if (!sample && !$('#pdfF').files[0]) { toast('請選擇 PDF 檔，或按「使用範例公告」'); return; }
  const t0 = dayStart(FL.off), t1 = dayStart(FL.off + 1);
  const sys = S.flights.filter(f => f.time >= t0 && f.time < t1).sort((a, b) => a.time - b.time);
  // 範例公告：以系統航班為基礎，製造差異（DEMO）
  const ann = sys.map(f => ({ t: fmtT(f.time), ship: ship(f.shipId).name, from: f.from, to: f.to }));
  if (ann.length > 3) { ann[3] = { ...ann[3], t: ann[3].t.replace(/:\d\d/, ':15') }; ann.splice(6, 1); ann.push({ t: '18:30', ship: '新五緣', from: '五通', to: '金門' }); }
  const key = a => `${a.ship}|${a.from}|${a.to}`;
  const rows = [];
  ann.forEach(a => { const m = sys.find(f => key({ ship: ship(f.shipId).name, from: f.from, to: f.to }) === key(a) && Math.abs(f.time - at(FL.off, ...a.t.split(':').map(Number))) < 3 * 3600e3);
    if (!m) rows.push(['公告有、系統沒有', a.t, a.ship, `${a.from}→${a.to}`, '—']);
    else if (fmtT(m.time) !== a.t) rows.push(['時間不符', a.t, a.ship, `${a.from}→${a.to}`, `系統 ${fmtT(m.time)}`]); });
  sys.forEach(f => { if (!ann.find(a => a.ship === ship(f.shipId).name && a.from === f.from && a.to === f.to)) rows.push(['系統有、公告沒有', fmtT(f.time), ship(f.shipId).name, `${f.from}→${f.to}`, '—']); });
  log('航班表勾稽', fmtD(t0), `差異 ${rows.length} 筆`); save();
  $('#pdfRes').innerHTML = `<div class="note">${sample ? '（使用範例公告）' : `已讀取「${esc($('#pdfF').files[0].name)}」（DEMO 以範例資料模擬解析）`}｜公告 ${ann.length} 班、系統 ${sys.length} 班，差異 <b>${rows.length}</b> 筆</div>
  <table><tr><th>差異類型</th><th>時間</th><th>船舶</th><th>航線</th><th>系統資料</th></tr>${rows.map(r => `<tr><td><span class="tag ${r[0] === '時間不符' ? 't-wait' : 't-no'}">${r[0]}</span></td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">完全相符</td></tr>'}</table>`;
}

/* ---------------- 旅客統計 */
let ST = { from: -30, to: 0, day: '全部', route: '', dir: '', by: '日期' };
VIEWS.stats = () => {
  const a = dayStart(ST.from), b = dayStart(ST.to + 1);
  let fl = S.flights.filter(f => f.time >= a && f.time < b && f.time < Date.now() && f.status !== '停航');
  if (ST.day === '平日') fl = fl.filter(f => { const w = new Date(f.time).getDay(); return w > 0 && w < 6; });
  if (ST.day === '週六日') fl = fl.filter(f => { const w = new Date(f.time).getDay(); return w === 0 || w === 6; });
  if (ST.route) fl = fl.filter(f => f.from === ST.route || f.to === ST.route);
  if (ST.dir) fl = fl.filter(f => f.dir === ST.dir);
  const keyFn = { '日期': f => fmtD(f.time).slice(5), '星期': f => '週' + WEEK[new Date(f.time).getDay()], '開航時段': f => fmtT(f.time), '船舶': f => ship(f.shipId).name, '航線': f => f.from === '金門' ? '金門→' + f.to : f.from + '→金門' }[ST.by];
  const g = {}; fl.forEach(f => { const k = keyFn(f); g[k] = g[k] || { out: 0, inn: 0, n: 0, cap: 0 }; g[k][f.dir === '出境' ? 'out' : 'inn'] += f.pax; g[k].n++; g[k].cap += f.cap; });
  let keys = Object.keys(g); if (ST.by === '星期') keys.sort((x, y) => '週日週一週二週三週四週五週六'.indexOf(x) - '週日週一週二週三週四週五週六'.indexOf(y)); else keys.sort();
  const tot = fl.reduce((s, f) => s + f.pax, 0), cap = fl.reduce((s, f) => s + f.cap, 0);
  const max = Math.max(1, ...keys.map(k => g[k].out + g[k].inn));
  const W = Math.max(600, keys.length * 26), H = 260, bw = Math.min(30, (W - 60) / Math.max(1, keys.length) - 6);
  const chart = `<svg viewBox="0 0 ${W} ${H + 40}">${[0, .25, .5, .75, 1].map(p => `<line x1="40" x2="${W}" y1="${H - p * (H - 20)}" y2="${H - p * (H - 20)}" stroke="#e6ebf2"/><text x="36" y="${H - p * (H - 20) + 4}" font-size="10" text-anchor="end" fill="#677485">${Math.round(max * p)}</text>`).join('')}
    ${keys.map((k, i) => { const x = 46 + i * ((W - 50) / keys.length); const ho = g[k].out / max * (H - 20), hi = g[k].inn / max * (H - 20);
      return `<rect x="${x}" y="${H - ho}" width="${bw}" height="${ho}" fill="#2f6fd6"><title>${k} 出境 ${g[k].out}</title></rect><rect x="${x}" y="${H - ho - hi}" width="${bw}" height="${hi}" fill="#5bbf8a"><title>${k} 入境 ${g[k].inn}</title></rect><text x="${x + bw / 2}" y="${H + 14}" font-size="10" text-anchor="middle" fill="#3d4a5a" transform="rotate(${keys.length > 16 ? 45 : 0} ${x + bw / 2} ${H + 14})">${esc(k)}</text>`; }).join('')}</svg>`;
  return `<div class="title"><h2>旅客統計分析</h2><span class="sub">交叉比對：依日期區間、平日／週六日、航線、出入境，自由切換統計維度</span><div class="sp"></div><button class="btn" onclick="exportStats()">⇩ 匯出 Excel</button></div>
  <div class="bar"><span>期間</span><input type="date" value="${fmtD(a)}" onchange="ST.from=Math.round((new Date(this.value).getTime()-dayStart(0))/864e5);render()"><span>～</span><input type="date" value="${fmtD(b - 1)}" onchange="ST.to=Math.round((new Date(this.value).getTime()-dayStart(0))/864e5);render()">
  <select onchange="ST.day=this.value;render()">${['全部','平日','週六日'].map(o => `<option ${ST.day === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
  <select onchange="ST.route=this.value;render()"><option value="">全部航線</option>${['五通','石井'].map(o => `<option ${ST.route === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
  <select onchange="ST.dir=this.value;render()"><option value="">出境＋入境</option>${['出境','入境'].map(o => `<option ${ST.dir === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
  <span>統計依</span><select onchange="ST.by=this.value;render()">${['日期','星期','開航時段','船舶','航線'].map(o => `<option ${ST.by === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
  <div class="kpis"><div class="kpi"><div class="n">${tot.toLocaleString()}</div><div class="l">旅客人數</div></div><div class="kpi"><div class="n">${fl.length}</div><div class="l">航班數</div></div><div class="kpi"><div class="n">${cap ? Math.round(tot / cap * 100) : 0}%</div><div class="l">平均載客率</div></div><div class="kpi"><div class="n">${fl.length ? Math.round(tot / fl.length) : 0}</div><div class="l">平均每班人數</div></div></div>
  <div class="card chart"><h3>依「${ST.by}」統計　<span class="small"><span style="color:#2f6fd6">■</span> 出境　<span style="color:#5bbf8a">■</span> 入境</span></h3><div style="overflow:auto">${keys.length ? chart : '<div class="empty">查無資料</div>'}</div></div>
  <div class="card"><div class="tbl"><table id="stTbl"><tr><th>${ST.by}</th><th class="num">航班數</th><th class="num">出境</th><th class="num">入境</th><th class="num">合計</th><th class="num">載客率</th></tr>${keys.map(k => `<tr><td>${esc(k)}</td><td class="num">${g[k].n}</td><td class="num">${g[k].out.toLocaleString()}</td><td class="num">${g[k].inn.toLocaleString()}</td><td class="num">${(g[k].out + g[k].inn).toLocaleString()}</td><td class="num">${Math.round((g[k].out + g[k].inn) / g[k].cap * 100)}%</td></tr>`).join('')}</table></div></div>`;
};
function exportStats() { const t = $('#stTbl'); downloadCSV('旅客統計.csv', [...t.rows].map(r => [...r.cells].map(c => c.innerText))); }

/* ---------------- LED */

  <td style="white-space:nowrap"><button class="btn s" onclick="editBoard('${x.id}')">設定</button><button class="btn r s" onclick="delBoard('${x.id}')">刪除</button></td></tr>`).join('')}</table></div>
  <div class="card">${b ? `<h3>即時畫面：${esc(b.name)}</h3>${ledPreview(b)}<div class="flex" style="margin-top:10px"><button class="btn p" onclick="pushBoard('${b.id}')">推送到看板</button><button class="btn" onclick="reconnect('${b.id}')">${b.online ? '重新啟動播放程式' : '重新連線'}</button><button class="btn" onclick="editBoard('${b.id}')">修改版面</button></div>
  <p class="small muted">航班資訊由「小三通航班」自動帶入；登船口、停航異動即時更新。</p>` : '<div class="empty">尚無看板</div>'}</div></div>`;
};
function ledPreview(b) {
  const t0 = dayStart(0), t1 = dayStart(1);
  const fl = S.flights.filter(f => f.time >= t0 && f.time < t1 && f.dir === b.kind && f.time > Date.now() - 3600e3).sort((x, y) => x.time - y.time).slice(0, 8);
  const st = f => f.status === '停航' ? '停航 Cancel' : f.status === '延誤' ? '延誤 Delay' : (b.kind === '出境' && f.time - Date.now() < 40 * 60e3 && f.time > Date.now() ? '登船中 Boarding' : '準時 On Time');
  if (!b.online) return `<div class="led" style="display:grid;place-items:center;color:#555">● 看板離線（最後回報 ${fmtS(b.last)}）</div>`;

function exportFees() { const t = $('#feeTbl'); downloadCSV('計費明細.csv', [...t.rows].map(r => [...r.cells].map(c => c.innerText))); }
function makeBills(ym) {
  const [y, m] = ym.split('-').map(Number); const a = new Date(y, m - 1, 1).getTime(), b = new Date(y, m, 1).getTime();
  const vs = S.voyages.filter(v => v.status === '通過' && v.actualOut >= a && v.actualOut < b);
  const g = {}; vs.forEach(v => { const c = ship(v.shipId).company, f = feeOf(v); g[c] = g[c] || { count: 0, berth: 0, garbage: 0 }; g[c].count++; g[c].berth += f.berth; g[c].garbage += f.garbage; });
  if (!vs.length) return 0;
  S.bills = S.bills.filter(x => x.ym !== ym);
  const due = fmtD(new Date(y, m, 15));
  Object.entries(g).forEach(([c, x]) => S.bills.push({ id: uid(), ym, company: c, ...x, total: x.berth + x.garbage, due, status: '未繳', paid: '' }));
  return Object.keys(g).length;
}
function genBills() {
  const n = makeBills(BL.ym);
  if (!n) { toast('該月份沒有已出港航次'); return; }
  log('產生月結帳單', BL.ym, `${n} 家航商`); save(); render();
  toast(`已產生 ${BL.ym} 月結帳單 ${n} 張，並以 Email 寄送繳費通知（模擬）`, 'ok');
}

      if (s0) { log('修改船舶', s0.name, diff(s0, o)); Object.assign(s0, o); } else { S.ships.push({ id: uid(), ...o, cum: o.cum || 0 }); log('新增船舶', o.name); } } });
}
function delShip(id) { const s = S.ships.find(x => x.id === id); if (S.voyages.some(v => v.shipId === id && !v.actualOut && v.status !== '停航取消')) { toast('⚠️ 此船舶尚有未完成航次，不能刪除'); return; } if (!confirm(`刪除船舶「${s.name}」？`)) return; S.ships = S.ships.filter(x => x.id !== id); log('刪除船舶', s.name); save(); render(); }
function editBerth(id) {
  const b0 = id ? S.berths.find(b => b.id === id) : null;
  formModal({ title: id ? '編輯泊位' : '新增泊位', data: b0 || { port: '水頭', type: '一般', cap: 1 }, fields: [
    { k: 'port', label: '港口', type: 'select', opts: S.ports.map(p => p.name) }, { k: 'name', label: '泊位名稱', req: true },
    { k: 'type', label: '類型', type: 'select', opts: ['小三通客輪','一般','貨船','小船泊區','遊艇'] }, { k: 'cap', label: '可停艘數', type: 'number', req: true },
    { k: 'x', label: '圖上 X 座標', type: 'number', hint: '0～1000' }, { k: 'y', label: '圖上 Y 座標', type: 'number', hint: '0～640' }, { k: 'note', label: '備註', full: true } ],
    onSave: o => { o.cap = Math.max(1, o.cap); if (b0) { log('修改泊位', b0.name, diff(b0, o)); Object.assign(b0, o); } else { S.berths.push({ id: 'B' + uid(), w: 70, h: 32, ...o, x: o.x === '' ? 900 : o.x, y: o.y === '' ? 590 : o.y }); log('新增泊位', o.name); } } });
}
function delBerth(id) { const b = S.berths.find(x => x.id === id); if (berthState(b).occ.length) { toast('⚠️ 泊位上有船靠泊中，不能刪除'); return; } if (!confirm(`刪除泊位「${b.name}」？`)) return; S.berths = S.berths.filter(x => x.id !== id); S.voyages.forEach(v => { if (v.berthId === id) v.berthId = ''; }); log('刪除泊位', b.name); save(); render(); }
function editPort(id) {
  const p0 = id ? S.ports.find(p => p.id === id) : null;
  formModal({ title: id ? '編輯港口' : '新增港口', data: p0 || { region: '金門', phase: '後續擴充', status: '規劃中' }, fields: [
    { k: 'name', label: '港口名稱', req: true }, { k: 'code', label: '代碼', req: true }, { k: 'region', label: '地區', type: 'select', opts: ['金門','北部','中部','南部','澎湖','馬祖'] },
    { k: 'phase', label: '建置階段', type: 'select', opts: ['第一期','第二期','後續擴充'] }, { k: 'status', label: '狀態', type: 'select', opts: ['建置中','規劃中','已上線'] } ],
    onSave: o => { if (p0) { log('修改港口', p0.name, diff(p0, o)); Object.assign(p0, o); } else { S.ports.push({ id: uid(), ...o }); log('新增港口', o.name); } } });
}
function delPort(id) { const p = S.ports.find(x => x.id === id); if (S.berths.some(b => b.port === p.name)) { toast('⚠️ 此港口仍有泊位，請先刪除泊位'); return; } if (!confirm(`刪除港口「${p.name}」？`)) return; S.ports = S.ports.filter(x => x.id !== id); log('刪除港口', p.name); save(); render(); }

/* ---------------- 帳號與權限 */
VIEWS.users = () => {
  const roles = ['管理者','審核員','航商','小船業者','海關'];
  const funcs = [['首頁儀表板','dash'],['港區調度','map'],['進出港申請','apply'],['航次管理','voyage'],['進出港動態','moving'],['港務台日誌','dutylog'],['小三通航班','flight'],['旅客統計','stats'],['LED 看板','led'],['計費與月結','billing'],['基本資料','master'],['帳號與權限','users'],['異動歷程','logs'],['介接與公開資訊','api']];
  const cell = (r, k) => PERM[k] === '*' || PERM[k].includes(r) ? (r === '海關' ? '👁 唯讀' : (['航商','小船業者'].includes(r) && ['apply','voyage','billing'].includes(k) ? '✔ 僅自己的船' : '✔')) : '—';
  return `<div class="title"><h2>帳號與權限</h2><span class="sub">角色權限（能用哪些功能）＋資料範圍（能看哪些船）兩層控管</span><div class="sp"></div><button class="btn p" onclick="editUser()">＋ 新增帳號</button></div>
  <div class="card"><div class="tbl"><table><tr><th>姓名／單位</th><th>帳號</th><th>角色</th><th>資料範圍</th><th>Email</th><th></th></tr>${S.users.map(u => `<tr><td><b>${esc(u.name)}</b><div class="small muted">${esc(u.unit || u.company)}</div></td><td>${esc(u.account)}</td><td>${tag(u.role)}</td><td>${u.company ? '僅「' + esc(u.company) + '」的船舶' : u.role === '海關' ? '全部（唯讀）' : '全部'}</td><td>${esc(u.email)}</td>
  <td style="white-space:nowrap"><button class="btn s" onclick="editUser('${u.id}')">編輯</button><button class="btn r s" onclick="delUser('${u.id}')" ${u.id === S.cur ? 'disabled title="不能刪除目前登入的帳號"' : ''}>刪除</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>角色權限對照</h3><div class="tbl"><table><tr><th>功能</th>${roles.map(r => `<th>${r}</th>`).join('')}</tr>${funcs.map(f => `<tr><td>${f[0]}</td>${roles.map(r => `<td>${cell(r, f[1])}</td>`).join('')}</tr>`).join('')}</table></div>
  <p class="small muted">試試看：右上角切換成「李大海（自用小船）」，只會看到自己的船與帳單；切換成「海關」則只能查詢、不能修改。</p></div>`;
};
function editUser(id) {
  const u0 = id ? S.users.find(u => u.id === id) : null;
  const comps = [...new Set(S.ships.map(s => s.company))];
  formModal({ title: id ? '編輯帳號' : '新增帳號', data: u0 || { role: '航商' }, fields: [
    { k: 'name', label: '姓名／名稱', req: true }, { k: 'account', label: '登入帳號', req: true },
    { k: 'role', label: '角色', type: 'select', opts: ['管理者','審核員','航商','小船業者','海關'], req: true }, { k: 'company', label: '所屬公司（航商／小船業者必填）', type: 'select', opts: [['', '（無）'], ...comps.map(c => [c, c])] },
    { k: 'unit', label: '單位' }, { k: 'email', label: 'Email（通知用）', type: 'email' } ],
    onSave: o => { if (['航商','小船業者'].includes(o.role) && !o.company) return '航商／小船業者需指定所屬公司（決定資料範圍）';
      if (!['航商','小船業者'].includes(o.role)) o.company = '';
      if (S.users.some(u => u.id !== id && u.account === o.account)) return '帳號重複';
      if (u0) { log('修改帳號', u0.account, diff(u0, o)); Object.assign(u0, o); } else { S.users.push({ id: 'u' + uid(), types: [], ...o }); log('新增帳號', o.account, o.role); } } });
}
function delUser(id) { const u = S.users.find(x => x.id === id); if (!confirm(`刪除帳號「${u.name}」？`)) return; S.users = S.users.filter(x => x.id !== id); log('刪除帳號', u.account); save(); render(); }

/* ---------------- 異動歷程 */
let LG = { q: '', page: 1 };
VIEWS.logs = () => {
  let ls = S.logs; if (LG.q) ls = ls.filter(l => (l.user + l.action + l.target + l.detail).includes(LG.q));
  const per = 25, pages = Math.max(1, Math.ceil(ls.length / per)); LG.page = Math.min(LG.page, pages);
  return `<div class="title"><h2>異動歷程</h2><span class="sub">誰、何時、改了什麼（修改前後內容）全部可查；舊系統只記錄費用金額修改</span><div class="sp"></div><button class="btn" onclick="downloadCSV('異動歷程.csv',[['時間','人員','動作','對象','內容'],...S.logs.map(l=>[fmt(l.time),l.user,l.action,l.target,l.detail])])">⇩ 匯出</button></div>
  <div class="bar"><input placeholder="搜尋人員／動作／對象" value="${esc(LG.q)}" onchange="LG.q=this.value;LG.page=1;render()"></div>
  <div class="tbl"><table><tr><th>時間</th><th>人員</th><th>動作</th><th>對象</th><th>內容</th></tr>${ls.slice((LG.page - 1) * per, LG.page * per).map(l => `<tr><td style="white-space:nowrap">${fmt(l.time)}</td><td>${esc(l.user)}</td><td>${tag(l.action)}</td><td>${esc(l.target)}</td><td class="small">${esc(l.detail)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">尚無紀錄，試著新增或修改資料</td></tr>'}</table></div>
  <div class="pager"><span class="muted">共 ${ls.length} 筆</span><button class="btn s" ${LG.page <= 1 ? 'disabled' : ''} onclick="LG.page--;render()">上一頁</button><span>${LG.page} / ${pages}</span><button class="btn s" ${LG.page >= pages ? 'disabled' : ''} onclick="LG.page++;render()">下一頁</button></div>`;
};

/* ---------------- 介接與公開資訊 */
VIEWS.api = () => {
  const t0 = dayStart(0), t1 = dayStart(1);
  const mt = S.voyages.filter(v => v.status === '通過' && v.inTime >= t0 && v.inTime < t1).slice(0, 4).map(v => ({ VoyageNo: v.code, VesselName: ship(v.shipId).name, VesselType: ship(v.shipId).type, Nationality: ship(v.shipId).nation, GrossTonnage: ship(v.shipId).gt, Port: 'TWKNH-水頭', Berth: berth(v.berthId)?.name || null, ETA: fmt(v.inTime), ETD: fmt(v.outTime), ATA: fmt(v.actualIn) || null, ATD: fmt(v.actualOut) || null, LastPort: v.prevPort, NextPort: v.nextPort, Status: v.move }));
  const open = S.flights.filter(f => f.time >= t0 && f.time < t1).slice(0, 3).map(f => ({ date: fmtD(f.time), time: fmtT(f.time), vessel: ship(f.shipId).name, from: f.from, to: f.to, status: f.status }));
  return `<div class="title"><h2>介接與公開資訊</h2><span class="sub">資料一次輸入、多處使用</span></div>
  <div class="grid2"><div class="card"><h3>介接清單</h3><table><tr><th>對象</th><th>內容</th><th>方式</th><th>狀態</th></tr>
  <tr><td>交通部航港局 MTNET</td><td>船舶進出港資料</td><td>API（本系統提供）</td><td>${tag('待取得規格')}</td></tr>
  <tr><td>售票劃位系統</td><td>航班、登船口、每班人數（不含個資）</td><td>API 雙向同步</td><td>${tag('正常')}</td></tr>
  <tr><td>LED 看板</td><td>到離港航班、跑馬燈</td><td>播放程式訂閱</td><td>${S.boards.every(b => b.online) ? tag('正常') : tag('部分離線')}</td></tr>
  <tr><td>海關</td><td>進出港資料查詢</td><td>唯讀帳號</td><td>${tag('正常')}</td></tr>
  <tr><td>差勤／門哨管制系統</td><td>單一登入</td><td>安全權杖（不放在網址）</td><td>${tag('規劃中')}</td></tr>
  <tr><td>外部單位</td><td>航班動態、船舶動態</td><td>開放資料 API</td><td>${tag('正常')}</td></tr></table></div>
  <div class="card"><h3>公開即時班表（手機版預覽）</h3><div style="max-width:360px;border:8px solid #222;border-radius:22px;padding:10px;margin:auto"><b>金門港 小三通即時班表</b><div class="small muted">${fmtD(Date.now())}</div>
  ${S.flights.filter(f => f.time >= t0 && f.time < t1 && f.dir === '出境').sort((a, b) => a.time - b.time).slice(0, 6).map(f => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0"><span>${fmtT(f.time)} ${esc(ship(f.shipId).name)}</span><span>→${esc(f.to)} ${tag(f.time < Date.now() ? '已離港' : f.status)}</span></div>`).join('')}</div></div></div>
  <div class="grid2"><div class="card"><h3>MTNET 進出港資料（範例回應）</h3><div class="small muted" style="margin-bottom:6px">GET /api/mtnet/voyages?date=${fmtD(t0)}</div><div class="json">${esc(JSON.stringify({ count: mt.length, data: mt }, null, 2))}</div></div>
  <div class="card"><h3>開放資料 API（範例回應）</h3><div class="small muted" style="margin-bottom:6px">GET /api/open/mtl-flights?date=${fmtD(t0)}</div><div class="json">${esc(JSON.stringify({ count: open.length, data: open }, null, 2))}</div></div></div>`;
};

/* ------------------------------------------------------------ start */
load(); save(); render();
</script>
</body>
</html>
