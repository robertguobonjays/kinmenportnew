<script>
/* ---------- 計費（加成＋人工調整） ---------- */
feeOf = function (v) {
  if (['停航取消','退回','待審'].includes(v.status)) return { hours: 0, berth: 0, garbage: 0, total: 0, rate: 0, ex: 1 };
  const s = ship(v.shipId); const a = v.actualIn || v.inTime, b = v.actualOut || v.outTime;
  const hours = Math.max(1, Math.ceil((b - a) / 3600e3)); const rate = rateOf(s.gt); const ex = (S.extras || []).find(x => x.name === v.extra)?.v || 1;
  const g = S.otherFees.filter(f => f.item === '垃圾清理費');
  let berthFee = hours * rate * ex, garbage = s.gt < 500 ? (g[0]?.amount || 0) : (g[1]?.amount || 0);
  if (v.adj?.berth != null) berthFee = v.adj.berth; if (v.adj?.garbage != null) garbage = v.adj.garbage;
  return { hours, berth: berthFee, garbage, total: berthFee + garbage, rate, ex };
};
function billOf(v) { if (!v.actualOut) return null; const ym = fmtD(v.actualOut).slice(0, 7); return S.bills.find(b => b.ym === ym && b.company === ship(v.shipId).company); }
function adjFee(vid, k) {
  const v = voy(vid); const f = feeOf(v); const cur = k === 'berth' ? f.berth : f.garbage;
  const n = prompt(`調整${k === 'berth' ? '碇泊費' : '垃圾清理費'}（目前 ${cur}）`, cur); if (n === null || n === '' || isNaN(n)) return;
  const r = prompt('調整原因（列入異動紀錄）', '依現場實際作業調整'); if (r === null) return;
  v.adj = { ...(v.adj || {}), [k]: Number(n) }; log('費用調整', `${ship(v.shipId).name} ${v.code}`, `${k === 'berth' ? '碇泊費' : '垃圾清理費'} ${cur} → ${n}（${r}）`); save(); render();
}

/* ---------- 港灣費用 ---------- */
let HF = { tab: '碇泊費', un: false, days: 14, co: '' };
VIEWS.harborfee = () => {
  const comps = [...new Set(S.ships.map(s => s.company))];
  const from = dayStart(-HF.days);
  let body = '';
  if (HF.tab === '碇泊費' || HF.tab === '垃圾清理費') {
    let vs = S.voyages.filter(v => v.status === '通過' && v.actualOut && v.actualOut >= from);
    if (HF.co) vs = vs.filter(v => ship(v.shipId).company === HF.co);
    if (HF.un) vs = vs.filter(v => !v.feeOk);
    vs.sort((a, b) => b.actualOut - a.actualOut);
    const isB = HF.tab === '碇泊費';
    let sum = vs.reduce((t, v) => t + (isB ? feeOf(v).berth : feeOf(v).garbage), 0);
    const pages = Math.max(1, Math.ceil(vs.length / 25)); HF.page = Math.min(HF.page || 1, pages);
    const allN = vs.length; vs = vs.slice((HF.page - 1) * 25, HF.page * 25);
    const pager = `<div class="pager"><span class="muted">共 ${allN} 筆</span><button class="btn s" ${HF.page <= 1 ? 'disabled' : ''} onclick="HF.page--;render()">上一頁</button><span>${HF.page} / ${pages}</span><button class="btn s" ${HF.page >= pages ? 'disabled' : ''} onclick="HF.page++;render()">下一頁</button></div>`;
    body = `<div class="tbl"><table id="hfTbl"><tr><th>付費公司</th><th>船舶名稱-航次</th><th>實際進港時間</th><th>開始時間</th><th>結束時間</th>${isB ? '<th class="num">時數</th><th class="num">費率</th><th>加成種類</th>' : '<th class="num">總噸位</th>'}<th class="num">總金額</th><th>計費日期</th><th>出帳</th><th>銷帳日期</th><th></th></tr>
    ${vs.map(v => { const s = ship(v.shipId), f = feeOf(v), b = billOf(v); const amt = isB ? f.berth : f.garbage; return `<tr><td class="small">${esc(s.company)}</td><td><b>${esc(s.name)}</b>-${v.code.split('-').pop()}</td><td>${fmtS(v.actualIn)}</td><td>${fmtS(v.actualIn)}</td><td>${fmtS(v.actualOut)}</td>
    ${isB ? `<td class="num">${f.hours}</td><td class="num">${f.rate}</td><td>${canEdit() ? `<select class="btn s" onchange="voy('${v.id}').extra=this.value;log('加成設定','${esc(s.name)} ${v.code}',this.value);save();render()">${S.extras.map(x => `<option ${x.name === v.extra ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : esc(v.extra)}</td>` : `<td class="num">${s.gt}</td>`}
    <td class="num"><b>${money(amt)}</b>${v.adj?.[isB ? 'berth' : 'garbage'] != null ? '<div class="small" style="color:var(--red)">已人工調整</div>' : ''}</td><td>${v.feeOk || '<span class="tag t-wait">未確認</span>'}</td><td>${b ? b.ym : '—'}</td><td>${b?.paid || '—'}</td>
    <td style="white-space:nowrap">${v.feeOk ? '' : `<button class="btn g s" onclick="voy('${v.id}').feeOk=fmtD(Date.now());log('計費確認','${esc(s.name)} ${v.code}');save();render()">確認</button>`}<button class="btn s" onclick="adjFee('${v.id}','${isB ? 'berth' : 'garbage'}')">調整</button></td></tr>`; }).join('') || '<tr><td colspan="13" class="empty">查無資料</td></tr>'}
    <tr><td colspan="${isB ? 8 : 6}" class="num"><b>合計（全部 ${allN} 筆）</b></td><td class="num"><b>${money(sum)}</b></td><td colspan="4"></td></tr></table></div>${pager}
    <p class="small muted">${isB ? '碇泊費＝靠泊時數（未滿 1 小時以 1 小時計）× 總噸位級距費率 × 加成值（依舊系統資料推算，待港務處確認）。' : '垃圾清理費依總噸位每航次計收（未滿 500 噸 98.5 元、500 噸以上 197 元，依舊系統資料推算）。'}</p>`;
  } else if (HF.tab === '曳船費' || HF.tab === '加水費') {
    const isT = HF.tab === '曳船費';
    const rows = isT ? S.tugs.filter(t => t.start >= from) : S.services.filter(x => x.type === '加水' && x.actual && x.start >= from);
    body = `<div class="tbl"><table id="hfTbl"><tr><th>船舶名稱-航次</th><th>付費公司</th><th>${isT ? '作業類別／拖船' : '船席'}</th><th>費用起始時間</th><th>費用結束時間</th><th class="num">${isT ? '計費馬力' : '加水量(噸)'}</th><th class="num">總金額</th><th>計費確認</th></tr>
    ${rows.map(r => { const v = voy(r.voyageId); const s = v ? ship(v.shipId) : {}; return `<tr><td><b>${esc(s.name)}</b>-${v?.code.split('-').pop() || ''}</td><td class="small">${esc(s.company)}</td><td>${isT ? esc(r.kind + '／' + r.tug) : esc(berth(r.berthId)?.name || '')}</td><td>${fmtS(isT ? r.start : r.actual.start)}</td><td>${fmtS(isT ? r.end : r.actual.end)}</td><td class="num">${isT ? r.billHp : r.actual.qty}</td><td class="num"><b>${money(isT ? tugFee(r) : svcFee(r))}</b></td><td>${isT ? (r.confirmed || '<span class="tag t-wait">未確認</span>') : tag('已回報')}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">查無資料</td></tr>'}</table></div>`;
  } else {
    const co = HF.co || comps[0]; let vs = S.voyages.filter(v => v.status === '通過' && v.actualOut && v.actualOut >= from && ship(v.shipId).company === co).sort((a, b) => a.actualIn - b.actualIn);
    let t = { b: 0, g: 0 };
    body = `<div class="card" id="billAtt" style="border:none;padding:0"><h3 style="text-align:center">金門縣港務處　帳單附件</h3><p class="muted" style="text-align:center">${esc(co)}｜${fmtD(from)} ～ ${fmtD(Date.now())}</p>
    <div class="tbl"><table id="hfTbl"><tr><th>船名</th><th>航次</th><th>進港時間</th><th>出港時間</th><th>上一港</th><th>進港停泊船席</th><th>下一港</th><th>航線</th><th class="num">碇泊費</th><th class="num">垃圾清理費</th><th class="num">金額合計</th></tr>
    ${vs.map(v => { const f = feeOf(v); t.b += f.berth; t.g += f.garbage; return `<tr><td>${esc(ship(v.shipId).name)}</td><td>${v.code}</td><td>${fmtS(v.actualIn)}</td><td>${fmtS(v.actualOut)}</td><td>${esc(v.prevPort)}</td><td>水頭-${esc(berth(v.berthId)?.name || '')}</td><td>${esc(v.nextPort)}</td><td>${routeOf(v.prevPort)}</td><td class="num">${money(f.berth)}</td><td class="num">${money(f.garbage)}</td><td class="num">${money(f.total)}</td></tr>`; }).join('') || '<tr><td colspan="11" class="empty">此期間無航次</td></tr>'}
    <tr><td colspan="8" class="num"><b>合計（${vs.length} 航次）</b></td><td class="num"><b>${money(t.b)}</b></td><td class="num"><b>${money(t.g)}</b></td><td class="num"><b>${money(t.b + t.g)}</b></td></tr></table></div></div>`;
  }
  return `<div class="title"><h2>港灣費用</h2><span class="sub">出港自動計費 → 確認 → 月結出帳 → 銷帳；可人工調整並留下紀錄</span><div class="sp"></div><button class="btn" onclick="downloadCSV('${HF.tab}.csv',[...$('#hfTbl').rows].map(r=>[...r.cells].map(c=>c.innerText)))">⇩ 匯出 Excel</button>${HF.tab === '帳單附件' ? '<button class="btn" onclick="window.print()">🖨 列印</button>' : ''}</div>
  <div class="bar"><div class="seg">${['碇泊費','垃圾清理費','曳船費','加水費','帳單附件'].map(t => `<a class="${HF.tab === t ? 'on' : ''}" onclick="HF.tab='${t}';HF.page=1;render()">${t}</a>`).join('')}</div></div>
  <div class="bar"><select onchange="HF.days=+this.value;render()">${[[7,'近 7 天'],[14,'近 14 天'],[31,'近 1 個月'],[45,'近 45 天']].map(o => `<option value="${o[0]}" ${HF.days === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
  <select onchange="HF.co=this.value;render()">${HF.tab === '帳單附件' ? '' : '<option value="">全部公司</option>'}${comps.map(c => `<option ${HF.co === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
  ${['碇泊費','垃圾清理費'].includes(HF.tab) ? `<label class="flex"><input type="checkbox" ${HF.un ? 'checked' : ''} onchange="HF.un=this.checked;render()">只看未確認</label>` : ''}</div><div class="card">${body}</div>`;
};

/* ---------- 航次統計 ---------- */
let VS = { ym: '', tab: '各港航次' };
VIEWS.vstats = () => {
  if (!VS.ym) VS.ym = fmtD(Date.now()).slice(0, 7);
  const [y, m] = VS.ym.split('-').map(Number); const a = new Date(y, m - 1, 1).getTime(), b = new Date(y, m, 1).getTime(); const days = (b - a) / 864e5;
  const vs = S.voyages.filter(v => v.status === '通過' && v.actualIn && v.actualIn >= a && v.actualIn < b);
  let body = '';
  if (VS.tab === '各港航次') {
    const g = {}; vs.forEach(v => { (g[v.prevPort] = g[v.prevPort] || { i: 0, o: 0 }).i++; if (v.actualOut) (g[v.nextPort] = g[v.nextPort] || { i: 0, o: 0 }).o++; });
    const tot = Object.values(g).reduce((s, x) => s + x.i + x.o, 0) || 1;
    body = ROUTES.map(r => { const ps = S.cports.filter(p => p.route === r && g[p.name]); if (!ps.length) return '';
      return `<tr><td colspan="5" style="background:#f6f8fb"><b>${r}</b></td></tr>` + ps.map(p => { const x = g[p.name]; return `<tr><td>${esc(p.name)}</td><td class="num">${x.i}</td><td class="num">${x.o}</td><td class="num">${x.i + x.o}</td><td class="num">${((x.i + x.o) / tot * 100).toFixed(2)}%</td></tr>`; }).join(''); }).join('');
    body = `<div class="tbl"><table id="vsTbl"><tr><th>對口港</th><th class="num">進港航次</th><th class="num">出港航次</th><th class="num">合計</th><th class="num">百分比</th></tr>${body || '<tr><td colspan="5" class="empty">本月無資料</td></tr>'}</table></div>`;
  } else if (VS.tab === '航線統計') {
    const r = {}; ROUTES.forEach(x => r[x] = { n: 0, ships: new Set() }); vs.forEach(v => { const k = routeOf(v.prevPort); r[k].n++; r[k].ships.add(v.shipId); });
    const tot = vs.length || 1, max = Math.max(1, ...ROUTES.map(x => r[x].n));
    body = `<div class="kpis"><div class="kpi"><div class="n">${vs.length}</div><div class="l">本港總計航次</div></div><div class="kpi"><div class="n">${(vs.length / days).toFixed(2)}</div><div class="l">日平均航次</div></div><div class="kpi"><div class="n">${(vs.length / days * 7).toFixed(2)}</div><div class="l">週平均航次</div></div><div class="kpi"><div class="n">${new Set(vs.map(v => v.shipId)).size}</div><div class="l">艘次</div></div></div>
    <div class="tbl"><table id="vsTbl"><tr><th>航線</th><th class="num">航次</th><th class="num">艘次</th><th class="num">日平均航次</th><th class="num">週平均航次</th><th class="num">百分比</th><th style="width:30%"></th></tr>${ROUTES.map(x => `<tr><td>${x}</td><td class="num">${r[x].n}</td><td class="num">${r[x].ships.size}</td><td class="num">${(r[x].n / days).toFixed(2)}</td><td class="num">${(r[x].n / days * 7).toFixed(2)}</td><td class="num">${(r[x].n / tot * 100).toFixed(1)}%</td><td><div style="height:12px;background:#2f6fd6;border-radius:3px;width:${r[x].n / max * 100}%"></div></td></tr>`).join('')}</table></div>`;
  } else {
    const g = {}; vs.forEach(v => { const x = g[v.shipId] = g[v.shipId] || { n: 0, r: {} }; x.n++; const k = routeOf(v.prevPort); x.r[k] = (x.r[k] || 0) + 1; });
    body = `<div class="tbl"><table id="vsTbl"><tr><th>船舶名稱</th><th class="num">總噸位</th><th>公司名稱</th><th class="num">總計航次</th><th class="num">週平均航次</th>${ROUTES.map(r => `<th class="num">${r.replace('航線', '')}</th>`).join('')}</tr>${Object.entries(g).sort((p, q) => q[1].n - p[1].n).map(([id, x]) => { const s = ship(id); return `<tr><td><b>${esc(s.name)}</b></td><td class="num">${s.gt}</td><td class="small">${esc(s.company)}</td><td class="num">${x.n}</td><td class="num">${(x.n / days * 7).toFixed(2)}</td>${ROUTES.map(r => `<td class="num">${x.r[r] || 0}</td>`).join('')}</tr>`; }).join('') || '<tr><td colspan="10" class="empty">本月無資料</td></tr>'}</table></div>`;
  }
  return `<div class="title"><h2>航次統計</h2><span class="sub">對應舊系統「港航次月統計表」「船舶航次月統計表」；只統計已進港靠泊的船舶，依進港靠泊時間</span><div class="sp"></div><button class="btn" onclick="downloadCSV('航次統計_${VS.ym}_${VS.tab}.csv',[...$('#vsTbl').rows].map(r=>[...r.cells].map(c=>c.innerText)))">⇩ 匯出 Excel</button></div>
  <div class="bar"><span>港口：水頭</span><input type="month" value="${VS.ym}" onchange="VS.ym=this.value;render()"><div class="seg">${['各港航次','航線統計','船舶航次'].map(t => `<a class="${VS.tab === t ? 'on' : ''}" onclick="VS.tab='${t}';render()">${t}</a>`).join('')}</div></div><div class="card">${body}</div>`;
};

/* ---------- 基本資料：新增分頁 ---------- */
const MTABS = [['ships','船舶'],['berths','船席'],['ports','作業港口'],['cports','對口港'],['dangers','危險品'],['extras','加成設定'],['params','系統參數']];
const MX = {
  cports: () => `<div class="bar"><span class="muted">申請表「前一港／次一港」選項，並決定航線統計歸類；保留 MtNet 代碼對應</span><span class="sp"></span><button class="btn p" onclick="editCport()">＋ 新增對口港</button></div>
    <div class="tbl"><table><tr><th>港名</th><th>航線類別</th><th>MtNet 代碼</th><th></th></tr>${S.cports.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.route)}</td><td>${esc(p.mtnet)}</td><td><button class="btn s" onclick="editCport('${p.id}')">編輯</button><button class="btn r s" onclick="if(confirm('刪除？')){S.cports=S.cports.filter(x=>x.id!=='${p.id}');log('刪除對口港','${esc(p.name)}');save();render()}">刪除</button></td></tr>`).join('')}</table></div>`,
  dangers: () => `<div class="bar"><span class="muted">船舶小修等申請可攜帶進港的危險品與數量上限</span><span class="sp"></span><button class="btn p" onclick="editDanger()">＋ 新增危險品</button></div>
    <div class="tbl"><table><tr><th>品名</th><th class="num">限制數量</th><th>是否有效</th><th></th></tr>${S.dangers.map(d => `<tr><td><b>${esc(d.name)}</b></td><td class="num">${d.limit}</td><td>${d.on ? '是' : '否'}</td><td><button class="btn s" onclick="editDanger('${d.id}')">編輯</button><button class="btn r s" onclick="if(confirm('刪除？')){S.dangers=S.dangers.filter(x=>x.id!=='${d.id}');log('刪除危險品','${esc(d.name)}');save();render()}">刪除</button></td></tr>`).join('')}</table></div>`,
  extras: () => `<div class="bar"><span class="muted">碇泊費加成值（在「港灣費用」逐航次選擇）</span><span class="sp"></span><button class="btn p" onclick="editExtra()">＋ 新增加成</button></div>
    <div class="tbl"><table><tr><th>費用項目</th><th>加成種類名稱</th><th class="num">加成值</th><th></th></tr>${S.extras.map(x => `<tr><td>${esc(x.item)}</td><td><b>${esc(x.name)}</b></td><td class="num">${x.v}</td><td><button class="btn s" onclick="editExtra('${x.id}')">編輯</button><button class="btn r s" onclick="if(confirm('刪除？')){S.extras=S.extras.filter(y=>y.id!=='${x.id}');log('刪除加成','${esc(x.name)}');save();render()}">刪除</button></td></tr>`).join('')}</table></div>`,
  params: () => `<div class="kv" style="grid-template-columns:260px 1fr;max-width:720px">${[['preDays','可預先申請天數','天'],['autoLogout','自動登出時間','分鐘'],['ledRows','LED 顯示筆數','筆'],['tugRate','曳船費單價（DEMO）','元／匹馬力·時'],['waterRate','加水費單價（DEMO）','元／噸']].map(([k, l, u]) => `<b>${l}</b><span><input type="number" class="btn" style="width:120px" value="${S.params[k]}" onchange="S.params['${k}']=+this.value;log('系統參數','${l}',this.value);save();toast('已儲存')"> ${u}</span>`).join('')}
    <b>「檢查」後才可產生出港動態</b><span><select class="btn" onchange="S.params.checkBeforeLeave=this.value==='1';log('系統參數','檢查後才可出港',this.options[this.selectedIndex].text);save();toast('已儲存')"><option value="1" ${S.params.checkBeforeLeave ? 'selected' : ''}>要</option><option value="0" ${S.params.checkBeforeLeave ? '' : 'selected'}>不用</option></select></span></div>`,
};
function editCport(id) { const p0 = id ? S.cports.find(p => p.id === id) : null; formModal({ title: id ? '編輯對口港' : '新增對口港', data: p0 || { route: '其他航線' }, fields: [{ k: 'name', label: '港名', req: true }, { k: 'route', label: '航線類別', type: 'select', opts: ROUTES }, { k: 'mtnet', label: 'MtNet 代碼' }], onSave: o => { if (p0) { log('修改對口港', p0.name, diff(p0, o)); Object.assign(p0, o); } else { S.cports.push({ id: uid(), ...o }); log('新增對口港', o.name); } } }); }
function editDanger(id) { const d0 = id ? S.dangers.find(d => d.id === id) : null; formModal({ title: id ? '編輯危險品' : '新增危險品', data: d0 ? { ...d0, on: d0.on ? '是' : '否' } : { on: '是' }, fields: [{ k: 'name', label: '品名', req: true }, { k: 'limit', label: '限制數量', type: 'number', req: true }, { k: 'on', label: '是否有效', type: 'select', opts: ['是','否'] }], onSave: o => { o.on = o.on === '是'; if (d0) { log('修改危險品', d0.name, diff(d0, o)); Object.assign(d0, o); } else { S.dangers.push({ id: uid(), ...o }); log('新增危險品', o.name); } } }); }
function editExtra(id) { const x0 = id ? S.extras.find(x => x.id === id) : null; formModal({ title: id ? '編輯加成' : '新增加成', data: x0 || { item: '碇泊費', v: 1 }, fields: [{ k: 'item', label: '費用項目', type: 'select', opts: ['碇泊費'] }, { k: 'name', label: '加成種類名稱', req: true }, { k: 'v', label: '加成值', type: 'number', step: '0.1', req: true }], onSave: o => { if (x0) { log('修改加成', x0.name, diff(x0, o)); Object.assign(x0, o); } else { S.extras.push({ id: uid(), ...o }); log('新增加成', o.name); } } }); }

/* ---------- 啟動 ---------- */
/* V3：啟動移到第三段程式最後 */
</script>

<script>
/* ============================================================
   V3：公開入口＋真實港區地圖（國土測繪中心／OpenStreetMap）
   ============================================================ */
function migrateV3() {
  if (S.v3) return;
  if (!S.users.find(u => u.id === 'u0')) S.users.unshift({ id: 'u0', name: '訪客', account: 'guest', role: '訪客', unit: '一般民眾', company: '', types: [], email: '' });
  const names = ['陳志明','林怡君','許文凱','洪佳慧','楊建華','李宗翰','吳淑芬','蔡明宏','王彥筑'];
  S.roster = [];
  for (let d = -1; d <= 6; d++) [['日班','08:00-16:00'],['小夜','16:00-24:00'],['大夜','00:00-08:00']].forEach(([n, t], i) => S.roster.push({ id: uid(), date: fmtD(dayStart(d)), shift: n, time: t, staff: names[(d + 1) * 3 % 9 + i], phone: '082-32-9538 分機 ' + (206 + i) }));

  S.mapBase = 'PHOTO2';
  S.cur = 'u0';
  S.v3 = true;
}
const isGuest = () => me().role === '訪客';
const PUB = [['portal','🏛️','公開入口'],['pin','⛴️','預定進港船舶'],['pout','🚢','預定出港船舶'],['pmap','🗺️','港區船席現況圖'],['plive','📡','即時船舶動態'],['pboard','🖥️','最新動態看板'],['psched','📅','最新船期看板'],['phist','🗂️','歷史船舶動態'],['porder','🔢','船席接靠順序'],['pduty','👮','港務台值班表']];
NAV.push(['公開資訊（免登入）', PUB]);
PUB.forEach(p => PERM[p[0]] = '*');
PERM.dash = ['管理者','審核員','航商','小船業者','海關'];
let BOARD_TIMER = null;
const _go = go;
go = function (v, sub) { if (BOARD_TIMER) { clearInterval(BOARD_TIMER); BOARD_TIMER = null; } if (typeof dropMap === 'function') dropMap(); if (isGuest() && !PERM[v]?.includes?.('訪客') && PERM[v] !== '*') v = 'portal'; _go(v, sub); };
resetDemo = function () {

  try { localStorage.removeItem(KEY); } catch (e) {}
  load(); migrateV2(); migrateV3(); save(); go('portal'); toast('已重設為初始展示資料', 'ok');
};
$('#userSel').onchange = e => { S.cur = e.target.value; save(); toast(`已切換為「${esc(me().name)}」`); go(isGuest() ? 'portal' : 'dash'); };
render = function () {

  <div class="f"><label>驗證碼</label><div class="flex"><input style="max-width:140px" value="7K3P"><span style="font-family:monospace;font-size:20px;letter-spacing:6px;background:#eef3fb;padding:4px 10px;border-radius:6px;text-decoration:line-through">7K3P</span></div></div></div>

  <div class="flex">${S.users.filter(u => u.id !== 'u0').map(u => `<button class="btn" onclick="S.cur='${u.id}';save();closeModal();go('dash');toast('歡迎，${esc(u.name)}','ok')">${esc(u.name)}<span class="muted small">（${esc(u.role)}）</span></button>`).join('')}</div>`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="const u=S.users.find(x=>x.account===$('#lgAcc').value);if(!u){toast('查無帳號');return}S.cur=u.id;save();closeModal();go('dash')">登入</button>`);
}

/* ---------- 公開入口 ---------- */
VIEWS.portal = () => {
  const B = (label, act, sub = '', cls = '') => `<div class="pbtn ${cls}" onclick="${act}"><i></i><span>${label}${sub ? `<span class="sub2">${sub}</span>` : ''}</span></div>`;
  const t0 = dayStart(0), t1 = dayStart(1);
  const nIn = S.voyages.filter(v => v.status === '通過' && v.move === '預報' && v.inTime < t1 + 864e5).length;
  const nAt = S.voyages.filter(v => v.status === '通過' && v.move === '靠泊').length;
  return `<div class="portal"><div class="phead"><h2>金門港 船舶動態系統</h2><div class="muted">水頭港區｜${fmtD(Date.now())}（${WEEK[new Date().getDay()]}）　在港 ${nAt} 艘・預定進港 ${nIn} 艘</div></div>
  <div class="pbtns">
    ${isGuest() ? B('進入（LOGIN）', 'loginBox()', '港務處、航商、業者登入', 'login') : B('進入系統', "go('dash')", '已登入：' + esc(me().name), 'login')}
    ${B('預定進港船舶', "go('pin')")}${B('預定出港船舶', "go('pout')")}
    ${B('港區船席現況圖', "go('pmap')", '國土測繪中心空拍圖')}${B('即時船舶動態', "go('plive')")}${B('最新動態看板', "go('pboard')")}
    ${B('附屬港船舶動態', "toast('料羅、九宮等港區列入第二期建置')", '料羅、九宮（第二期）')}${B('歷史船舶動態', "go('phist')")}${B('最新船期看板', "go('psched')", '小三通航班')}
    ${B('船席接靠順序', "go('porder')")}${B('港務台值班表', "go('pduty')")}${B('船席指泊', isStaff() ? "go('map')" : "loginBox();toast('船席指泊需港務處人員登入')", '港務處人員')}
  </div>
  <div class="pinfo"><ul>
    <li><b>水頭港區服務台</b>：(082) 32-9538；處本部：(082) 33-2268（展示資料）。</li>
    <li>本系統以響應式網頁開發，電腦、平板、手機皆可使用；欄位太多時可左右滑動表格。</li>
    <li>船席現況圖底圖採用<b>內政部國土測繪中心</b>正射影像／通用電子地圖，亦可切換 OpenStreetMap。</li>
  </ul></div></div>`;
};
const pubTitle = (t, sub) => `<div class="title"><a class="btn s" onclick="go('portal')">‹ 公開入口</a><h2>${t}</h2><span class="sub">${sub || ''}</span><div class="sp"></div><span class="small muted">更新：${fmtT(Date.now())}</span></div>`;
const dayTabs = (key, cur) => `<div class="seg">${[['今天', 0], ['明天', 1], ['後天', 2]].map(([n, o]) => `<a class="${cur === o ? 'on' : ''}" onclick="${key}=${o};render()">${n}</a>`).join('')}</div>`;
const agent = s => (s.company || '').replace(/股份有限公司|有限公司|航運|海運|船務代理/g, '').slice(0, 4) || s.company;
let PIN = 0, POUT = 0;
VIEWS.pin = () => {
  const a = dayStart(PIN), b = dayStart(PIN + 1);
  const vs = S.voyages.filter(v => v.status === '通過' && v.inTime >= a && v.inTime < b).sort((x, y) => x.inTime - y.inTime);
  return pubTitle('預定進港船舶', '已核准的進港航次') + `<div class="bar">${dayTabs('PIN', PIN)}<b>${fmtD(a)}</b></div>
  <div class="card"><div class="tbl"><table><tr><th>預定抵港</th><th>船名</th><th>船種</th><th class="num">總噸</th><th>船公司／代理</th><th>前一港</th><th>預定船席</th><th>航次</th><th>動態</th></tr>
  ${vs.map(v => { const s = ship(v.shipId); return `<tr><td><b>${fmtT(v.inTime)}</b></td><td><b>${esc(s.name)}</b></td><td>${esc(s.type)}</td><td class="num">${s.gt}</td><td class="small">${esc(s.company)}</td><td>${esc(v.prevPort)}</td><td>${esc(berth(v.berthId)?.name || '待指泊')}</td><td>${v.code}</td><td>${v.move === '預報' ? tag(STEPS9[stepIdx(v)]) : tag(v.move === '靠泊' ? '已靠泊' : v.move)}</td></tr>`; }).join('') || '<tr><td colspan="9" class="empty">無預定進港船舶</td></tr>'}</table></div></div>`;
};
VIEWS.pout = () => {
  const a = dayStart(POUT), b = dayStart(POUT + 1);
  const vs = S.voyages.filter(v => v.status === '通過' && v.outTime >= a && v.outTime < b && v.move !== '預報').sort((x, y) => x.outTime - y.outTime);
  return pubTitle('預定出港船舶', '在港船舶的預定離港時間') + `<div class="bar">${dayTabs('POUT', POUT)}<b>${fmtD(a)}</b></div>
  <div class="card"><div class="tbl"><table><tr><th>預定離港</th><th>船名</th><th>船種</th><th>船公司／代理</th><th>目前船席</th><th>次一港</th><th>出港申請</th><th>狀態</th></tr>
  ${vs.map(v => { const s = ship(v.shipId); const lv = appsOf(v.id, '出港').find(x => x.status === '通過'); return `<tr><td><b>${fmtT(v.outTime)}</b></td><td><b>${esc(s.name)}</b></td><td>${esc(s.type)}</td><td class="small">${esc(s.company)}</td><td>${esc(berth(v.berthId)?.name || '—')}</td><td>${esc(v.nextPort)}</td><td>${lv ? tag(lv.checked ? '已核准・已檢查' : '已核准') : '<span class="tag t-wait">審核中</span>'}</td><td>${v.move === '已出港' ? tag('已出港') + ` <span class="small muted">${fmtT(v.actualOut)}</span>` : v.outTime < Date.now() ? '<span class="tag t-no">延後</span>' : tag('靠泊')}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">無預定出港船舶</td></tr>'}</table></div></div>`;
};
VIEWS.plive = () => {
  const vs = S.voyages.filter(v => v.status === '通過' && (v.move === '靠泊' || (v.move === '預報' && (v.stepLog || []).length) || (v.actualOut && v.actualOut > Date.now() - 864e5)));
  vs.sort((x, y) => lastT(y) - lastT(x));
  return pubTitle('即時船舶動態', '近 24 小時動態，依最後動態時間排序') + `<div class="card"><div class="tbl"><table><tr><th>最後動態時間</th><th>船名</th><th>船種</th><th>移動現況</th><th>上一港</th><th>下一港</th><th>船席</th></tr>
  ${vs.map(v => { const s = ship(v.shipId); return `<tr><td><b>${fmtS(lastT(v))}</b></td><td><b>${esc(s.name)}</b></td><td>${esc(s.type)}</td><td>${tag(nowStatus(v))}</td><td>${esc(v.prevPort)}</td><td>${esc(v.nextPort)}</td><td>${esc(berth(v.berthId)?.name || '—')}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">無資料</td></tr>'}</table></div></div>`;
};
function boardHtml(kind) {
  const now = Date.now(), t0 = dayStart(0), t1 = dayStart(1);
  if (kind === 'sched') {
    const fl = S.flights.filter(f => f.time >= t0 && f.time < t1).sort((a, b) => a.time - b.time);
    const row = f => { const done = f.time < now - 20 * 60e3; const st = f.status === '停航' ? ['停航 Cancelled', 'st-no'] : f.status === '延誤' ? ['延誤 Delayed', 'st-wait'] : done ? [f.dir === '出境' ? '已離港 Departed' : '已到港 Arrived', 'st-gray'] : f.dir === '出境' && f.time - now < 40 * 60e3 ? ['登船中 Boarding', 'st-wait'] : ['準時 On Time', 'st-ok'];
      return `<tr><td><b>${fmtT(f.time)}</b></td><td>${esc(ship(f.shipId).name)}</td><td>${esc(f.dir === '出境' ? f.to : f.from)}</td><td>${f.dir === '出境' ? esc(f.gate.replace('號登船口', '')) : '—'}</td><td class="${st[1]}">${st[0]}</td></tr>`; };
    const half = d => `<div class="bigboard" style="margin-bottom:14px"><div class="bh"><b>${d === '出境' ? '離港班次 Departures' : '到港班次 Arrivals'}</b><span>${fmtT(now)}</span></div><table><tr><th>時間 Time</th><th>船名 Vessel</th><th>${d === '出境' ? '目的港 To' : '出發港 From'}</th><th>登船口 Gate</th><th>狀態 Status</th></tr>${fl.filter(f => f.dir === d).map(row).join('')}</table></div>`;
    return `<div class="grid2">${half('出境')}${half('入境')}</div>`;
  }
  const at = S.voyages.filter(v => v.status === '通過' && v.move === '靠泊').sort((a, b) => a.outTime - b.outTime);
  const come = S.voyages.filter(v => v.status === '通過' && v.move === '預報' && v.inTime < t1 + 6 * 3600e3 && v.inTime > now - 6 * 3600e3).sort((a, b) => a.inTime - b.inTime).slice(0, 12);
  return `<div class="grid2"><div class="bigboard"><div class="bh"><b>即將進港 Arriving</b><span>${fmtT(now)}</span></div><table><tr><th>預定</th><th>船名</th><th>來自</th><th>船席</th><th>動態</th></tr>${come.map(v => `<tr><td><b>${fmtT(v.inTime)}</b></td><td>${esc(ship(v.shipId).name)}</td><td>${esc(v.prevPort)}</td><td>${esc(berth(v.berthId)?.name || '待指泊')}</td><td class="${stepIdx(v) > 0 ? 'st-wait' : 'st-ok'}">${STEPS9[stepIdx(v)]}</td></tr>`).join('') || '<tr><td colspan="5">—</td></tr>'}</table></div>
  <div class="bigboard"><div class="bh"><b>在港船舶 In Port</b><span>${at.length} 艘</span></div><table><tr><th>船席</th><th>船名</th><th>靠泊</th><th>預定離港</th><th>往</th></tr>${at.map(v => `<tr><td><b>${esc(berth(v.berthId)?.name || '')}</b></td><td>${esc(ship(v.shipId).name)}</td><td>${fmtT(v.actualIn)}</td><td class="${v.outTime < now ? 'st-no' : ''}">${fmtS(v.outTime)}</td><td>${esc(v.nextPort)}</td></tr>`).join('') || '<tr><td colspan="5">—</td></tr>'}</table></div></div>`;
}
VIEWS.pboard = () => pubTitle('最新動態看板', '每 30 秒自動更新，可投放到大廳螢幕（按 F11 全螢幕）') + `<div id="boardBox">${boardHtml('dyn')}</div>`;
VIEWS.psched = () => pubTitle('最新船期看板', '今日小三通到離港班次，每 30 秒自動更新') + `<div id="boardBox">${boardHtml('sched')}</div>`;
AFTER.pboard = () => { BOARD_TIMER = setInterval(() => { const b = $('#boardBox'); if (b) b.innerHTML = boardHtml('dyn'); }, 30000); };
AFTER.psched = () => { BOARD_TIMER = setInterval(() => { const b = $('#boardBox'); if (b) b.innerHTML = boardHtml('sched'); }, 30000); };
let PH = { from: -7, q: '' };
VIEWS.phist = () => {
  const a = dayStart(PH.from);
  let vs = S.voyages.filter(v => v.actualOut && v.actualOut >= a && v.status === '通過');
  if (PH.q) vs = vs.filter(v => ship(v.shipId).name.includes(PH.q));
  vs.sort((x, y) => y.actualOut - x.actualOut);
  return pubTitle('歷史船舶動態', '已出港航次查詢') + `<div class="bar"><input placeholder="船名" value="${esc(PH.q)}" onchange="PH.q=this.value;render()"><select onchange="PH.from=+this.value;render()">${[[-3,'近 3 天'],[-7,'近 7 天'],[-30,'近 30 天'],[-45,'近 45 天']].map(o => `<option value="${o[0]}" ${PH.from === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select><span class="muted">共 ${vs.length} 航次</span></div>
  <div class="card"><div class="tbl"><table><tr><th>船名</th><th>航次</th><th>上一港</th><th>實際進港</th><th>船席</th><th>實際出港</th><th>下一港</th><th class="num">在港時數</th></tr>
  ${vs.slice(0, 150).map(v => `<tr><td><b>${esc(ship(v.shipId).name)}</b></td><td>${v.code}</td><td>${esc(v.prevPort)}</td><td>${fmtS(v.actualIn)}</td><td>${esc(berth(v.berthId)?.name || '—')}</td><td>${fmtS(v.actualOut)}</td><td>${esc(v.nextPort)}</td><td class="num">${Math.ceil((v.actualOut - v.actualIn) / 3600e3)}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">查無資料</td></tr>'}</table></div>${vs.length > 150 ? '<p class="small muted">僅顯示最近 150 筆</p>' : ''}</div>`;
};
VIEWS.porder = () => {
  const bs = S.berths.filter(b => b.port === '水頭');
  const un = S.voyages.filter(v => v.status === '通過' && v.move === '預報' && !v.berthId && v.inTime < dayStart(2)).sort((a, b) => a.inTime - b.inTime);
  return pubTitle('船席接靠順序', '各船席目前靠泊與後續排定（依預定進港時間）') + `<div class="ord">${bs.map(b => { const st = berthState(b); const q = S.voyages.filter(v => v.status === '通過' && v.move === '預報' && v.berthId === b.id && v.inTime < dayStart(2)).sort((x, y) => x.inTime - y.inTime);
    return `<div class="card"><h4><span>⚓ ${esc(b.name)}</span>${st.occ.length ? tag('使用中') : tag('空泊位')}</h4>${st.occ.map(v => `<div class="small">● 靠泊中：<b>${esc(ship(v.shipId).name)}</b>（預定 ${fmtS(v.outTime)} 離）</div>`).join('')}
    ${q.length ? `<ol>${q.map(v => `<li><b>${esc(ship(v.shipId).name)}</b> <span class="muted small">${fmtS(v.inTime)} 進</span></li>`).join('')}</ol>` : '<div class="small muted">無後續排定</div>'}</div>`; }).join('')}
  <div class="card"><h4><span>📋 待指泊</span><span class="tag t-wait">${un.length}</span></h4>${un.length ? `<ol>${un.map(v => `<li><b>${esc(ship(v.shipId).name)}</b> <span class="muted small">${fmtS(v.inTime)}</span></li>`).join('')}</ol>` : '<div class="small muted">無</div>'}</div></div>`;
};
VIEWS.pduty = () => {
  const days = [...new Set(S.roster.map(r => r.date))].filter(d => d >= fmtD(dayStart(0)));
  return pubTitle('港務台值班表', '對應高雄港「信號台排班查詢」') + `<div class="card"><div class="tbl"><table><tr><th>日期</th><th>日班 08-16</th><th>小夜 16-24</th><th>大夜 00-08</th></tr>
  ${days.map(d => `<tr><td><b>${d.slice(5)}</b>（${WEEK[new Date(d).getDay()]}）</td>${['日班','小夜','大夜'].map(s => { const r = S.roster.find(x => x.date === d && x.shift === s); return `<td>${r ? `${esc(r.staff)}<div class="small muted">${esc(r.phone)}</div>` : '—'}</td>`; }).join('')}</tr>`).join('')}</table></div>
  <p class="small muted">值班人員為展示資料。正式版由港務處於後台排班，並與港務台日誌連動。</p></div>`;
};

<script>
/* ---------- 港區地圖（Leaflet） ---------- */
const BASES = {
  PHOTO2: { name: '國土測繪中心 正射影像（空拍）', url: 'https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}', attr: '底圖 © 內政部國土測繪中心' },
  EMAP: { name: '國土測繪中心 通用電子地圖', url: 'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', attr: '底圖 © 內政部國土測繪中心' },
  OSM: { name: 'OpenStreetMap', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: '© OpenStreetMap contributors' },
};
// 船席座標（依國土測繪中心正射影像判讀之示意位置，可在地圖上拖曳校正）
const BPOS = { S1L: [24.416253, 118.286180, -90], S1R: [24.416253, 118.286502, -90], S2L: [24.416351, 118.287296, -90], S2R: [24.416351, 118.287618, -90],
  S3L: [24.416448, 118.288047, -90], S3R: [24.416448, 118.288369, -90], S4: [24.416644, 118.284957, 0], NB: [24.419379, 118.289077, -90], SB: [24.415960, 118.284893, 0],
  CG: [24.418109, 118.293154, 0], EB: [24.418012, 118.295944, 0], EY: [24.417425, 118.296373, 0] };
const SHIPC = { '小三通客船': '#2f80ed', '貨船': '#f2c94c', '遊艇': '#ffffff', '自用小船': '#6fcf97', '漁船': '#eb5757' };
function bpos(b) { if (S.berthPos?.[b.id]) return S.berthPos[b.id]; if (BPOS[b.id]) return BPOS[b.id]; const i = S.berths.indexOf(b); return [24.4170 - (i % 4) * 0.0003, 118.2905 + (i % 3) * 0.0006, 0]; }
let LMAP = null, BERTH_EDIT = false;
function dropMap() { if (!LMAP) return; try { LMAP.off(); LMAP.stop(); LMAP.remove(); } catch (e) {} LMAP = null; }
function buildMap(ro) {
  const el = $('#lmap'); if (!el) return;
  if (!window.L) { el.outerHTML = `<div class="note">⚠️ 無法載入線上地圖（可能未連網），暫以示意圖顯示。</div>${aerialSVG()}`; return; }
  dropMap();
  const v0 = S.mapView || { c: [24.4174, 118.2885], z: 17 };
  const m = LMAP = L.map(el, { zoomControl: true, maxZoom: 20 }).setView(v0.c, v0.z);
  const bl = {}; Object.entries(BASES).forEach(([k, b]) => bl[b.name] = L.tileLayer(b.url, { maxZoom: 20, maxNativeZoom: 19, attribution: b.attr }));
  (bl[BASES[S.mapBase || 'PHOTO2'].name]).addTo(m);

  L.control.layers(bl, { '船舶圖像': shipsL, '船舶名稱': labL, '船席編號': berthL, '今日排定（虛線）': schL }, { collapsed: window.innerWidth < 820 }).addTo(m);
  m.addLayer(labL);
  L.control.scale({ imperial: false }).addTo(m);
  m.on('baselayerchange', e => { S.mapBase = Object.keys(BASES).find(k => BASES[k].name === e.name); save(); });
  m.on('overlayadd overlayremove', e => { if (e.name === '船舶名稱') el.classList.toggle('hide-lab', e.type === 'overlayremove'); if (e.name === '船席編號') el.classList.toggle('hide-berth', e.type === 'overlayremove'); });
  m.on('moveend', () => { if (LMAP !== m) return; const c = m.getCenter(); S.mapView = { c: [c.lat, c.lng], z: m.getZoom() }; save(); });
  const shipMarkers = {};
  S.berths.filter(b => b.port === '水頭').forEach(b => {
    const [la, ln, rot] = bpos(b); const st = berthState(b);
    const col = { free: '#2e9d5b', sch: '#e0a100', part: '#e07b00', full: '#d64545' }[st.state];
    const bm = L.marker([la, ln], { draggable: !ro && BERTH_EDIT, icon: L.divIcon({ className: '', html: `<div class="lb ${MAPSEL === b.id ? 'sel' : ''}" data-bid="${b.id}"style="--c:${col}">${esc(b.name)}${st.sch.length ? ' ⏱' + st.sch.length : ''}</div>`, iconSize: [0, 0] }) }).addTo(berthL);
    bm.on('click', () => { if (ro) { bm.bindPopup(berthPopup(b)).openPopup(); } else selBerth(b.id); });
    bm.on('dragend', e => { const p = e.target.getLatLng(); S.berthPos = S.berthPos || {}; S.berthPos[b.id] = [p.lat, p.lng, rot]; log('校正船席位置', b.name, `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`); save(); toast(`已更新「${esc(b.name)}」位置`); });
    const draw = (v, i, sch) => {
      const s = ship(v.shipId); const off = b.cap > 1 ? (i - (st.occ.length - 1) / 2) * 0.00012 : sch ? 0.00005 * (i + 1) : 0;
      const p = rot === -90 ? [la + (b.cap > 1 ? 0 : 0.00018), ln + off] : [la - 0.00006, ln + off + (b.cap > 1 ? 0 : 0.00025)];
      const late = !sch && v.outTime < Date.now();
      const html = `<div class="lsw"><div class="lhull ${sch ? 'sch' : ''}" style="background:${SHIPC[s.type] || '#ccc'};transform:rotate(${rot}deg) scale(${s.gt >= 300 ? 1 : .6})"></div><div class="llab ${sch ? 'p' : ''}">${esc(s.name)}<small>»${esc(agent(s))}</small>${late ? '<span class="bad">!</span>' : ''}${sch ? ` <small>${fmtT(v.inTime)}</small>` : ''}</div></div>`;
      const mk = L.marker(p, { draggable: !ro && isStaff(), icon: L.divIcon({ className: '', html, iconSize: [0, 0] }) }).addTo(sch ? schL : shipsL);
      mk.on('dragend', e => { const nb = nearestBerth(m, e.target.getLatLng()); if (nb && nb.id !== b.id) dockShip(v.id, nb.id); else { toast(nb ? '仍在原船席' : '請拖到船席附近（約 80 公尺內）'); render(); } });
      mk.bindPopup(shipPopup(v, ro)); shipMarkers[v.id] = mk;
    };
    st.occ.forEach((v, i) => draw(v, i, false)); st.sch.forEach((v, i) => draw(v, i, true));
  });
  const Search = L.Control.extend({ onAdd() {
    const d = L.DomUtil.create('div', 'lsearch');
    d.innerHTML = `<span>🔎</span><select id="lsBerth"><option value="">船席</option>${S.berths.filter(b => b.port === '水頭').map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><input id="lsShip" placeholder="船名">${ro ? '' : `<label class="small"><input type="checkbox" id="lsEdit" ${BERTH_EDIT ? 'checked' : ''}> 調整船席位置</label>`}`;
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    setTimeout(() => {
      $('#lsBerth').onchange = e => { const b = berth(e.target.value); if (b) { m.flyTo(bpos(b).slice(0, 2), 19); if (!ro) selBerth(b.id); } };
      $('#lsShip').onchange = e => { const q = e.target.value.trim(); const v = S.voyages.find(x => x.status === '通過' && (x.move === '靠泊' || x.move === '預報') && ship(x.shipId).name.includes(q) && shipMarkers[x.id]); if (!v) { toast('目前港內查無此船'); return; } m.flyTo(shipMarkers[v.id].getLatLng(), 19); setTimeout(() => { if (LMAP === m) shipMarkers[v.id].openPopup(); }, 900); };
      const ed = $('#lsEdit'); if (ed) ed.onchange = e => { BERTH_EDIT = e.target.checked; render(); toast(BERTH_EDIT ? '可拖曳船席標籤到正確位置，放開即儲存' : '已關閉位置調整'); };
    });

  setTimeout(() => { if (LMAP === m) m.invalidateSize(); }, 50);
}
function shipPopup(v, ro) {

  return `<b style="font-size:15px">${esc(s.name)}</b> <span class="muted">${esc(s.type)}</span><br>${esc(s.company)}<br>航次 ${v.code}<br>
  ${v.move === '靠泊' ? `靠泊 ${fmtS(v.actualIn)}　預定離港 ${fmtS(v.outTime)}<br>次一港 ${esc(v.nextPort)}` : `預定 ${fmtS(v.inTime)} 進港（${esc(v.prevPort)}）<br>目前：${STEPS9[stepIdx(v)]}`}
  ${!ro && isStaff() ? `<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${v.move === '靠泊' ? `<button class="btn r s" onclick="depart('${v.id}')">出港</button><button class="btn s" onclick="openShift('${v.id}')">航次異動</button><span class="small">${lv ? (lv.checked ? '✔ 可出港' : '! 待移民署檢查') : '! 出港未核准'}</span>` : `<button class="btn g s" onclick="arrive('${v.id}')">靠泊</button>`}</div>` : ''}`;
}
function berthPopup(b) { const st = berthState(b); return `<b>⚓ ${esc(b.name)}</b>（${esc(b.type)}）<br>${st.occ.map(v => '靠泊：' + esc(ship(v.shipId).name)).join('<br>') || '目前空泊位'}${st.sch.length ? '<br>今日排定：' + st.sch.map(v => `${esc(ship(v.shipId).name)} ${fmtT(v.inTime)}`).join('、') : ''}`; }
const MAP_LEGEND = `<div class="legend"><span><i style="background:#2f80ed"></i>小三通客船</span><span><i style="background:#f2c94c"></i>貨船</span><span><i style="background:#fff;border:1px solid #999"></i>遊艇</span><span><i style="background:#6fcf97"></i>自用小船</span><span><i style="background:#eb5757"></i>漁船</span>
  <span>｜船席框色：<i style="background:#2e9d5b"></i>空 <i style="background:#e0a100"></i>今日已排 <i style="background:#d64545"></i>靠泊中</span><span>虛線＝今日排定、<span style="background:#e53525;color:#fff;border-radius:50%;padding:0 4px">!</span>＝超過預定離港</span></div>`;
const _mapView = VIEWS.map;
VIEWS.map = () => {
  if (MAPLV !== 'harbor') return _mapView();
  const crumb = `<div class="crumb"><a onclick="MAPLV='region';render()">全區地圖</a> › <a onclick="MAPLV='kinmen';render()">金門</a> › <b>水頭港</b></div>`;
  return `<div class="title"><h2>港區調度（船席指泊）</h2><span class="sub">點船席標籤指派船班、靠泊、出港、移泊；點船舶看詳情。右上角可切換空拍圖／電子地圖／OpenStreetMap</span></div>${crumb}
  <div class="mapwrap"><div class="mapbox"><div id="lmap" class="lmap"></div>${MAP_LEGEND}</div><div class="card" id="berthPanel">${berthPanel()}</div></div>`;
};
AFTER.map = () => { if (MAPLV === 'harbor') buildMap(false); };
VIEWS.pmap = () => pubTitle('港區船席現況圖', '水頭港區即時靠泊情形；右上角切換底圖與圖層，左下角可搜尋船席或船名') + `<div class="mapbox"><div id="lmap" class="lmap"></div>${MAP_LEGEND}</div>`;
AFTER.pmap = () => buildMap(true);
const _selBerth = selBerth;
selBerth = function (id) { MAPSEL = id; const p = $('#berthPanel'); if (p && LMAP) { p.innerHTML = berthPanel(); document.querySelectorAll('.lb').forEach(e => e.classList.toggle('sel', e.textContent.startsWith(berth(id).name))); } else render(); };

/* ---------- 啟動 ---------- */
/* V4：啟動移到第四段程式最後 */
</script>
<style>

<script>
/* ============================================================
   V4：① 圖像化指泊——把船舶卡片拖到船席（或先點船、再點船席）；
       地圖上的船也能直接拖到別的船席＝移泊；實景地圖／示意圖可切換
   ② 雲端資料庫（選用）：填入 Supabase 的網址與金鑰後，所有人看到同一份資料
   ============================================================ */
const CLOUD = {
  url: 'https://wcpoxkxlrvdkexecklwj.supabase.co',   // 例：https://abcdefgh.supabase.co   （Supabase › Project Settings › API › Project URL）
  key: 'sb_publishable_H4q-LYty0ak6BvbQ3q4VgA_rXodocXU',   // anon public key（Supabase › Project Settings › API › anon public）
  id: 'kinmen-demo',
};
const cloudOn = () => !!(CLOUD.url && CLOUD.key);
let CLOUD_T = null, CLOUD_AT = '', CLOUD_BUSY = false;
const cloudHdr = () => ({ apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key, 'Content-Type': 'application/json' });
function cloudLbl(t, ok = true) { const e = $('#cloudLbl'); if (e) { e.textContent = t; e.style.color = ok ? '#bfe3ff' : '#ffb3b3'; e.style.marginRight = '8px'; } }
async function cloudLoad() {
  const r = await fetch(`${CLOUD.url}/rest/v1/demo_state?id=eq.${encodeURIComponent(CLOUD.id)}&select=data,updated_at`, { headers: cloudHdr() });
  if (!r.ok) throw new Error('讀取失敗 ' + r.status);
  const rows = await r.json();
  return rows[0] || null;
}
async function cloudPush() {
  CLOUD_BUSY = true;
  try {
    const at = new Date().toISOString();
    const r = await fetch(`${CLOUD.url}/rest/v1/demo_state`, { method: 'POST', headers: { ...cloudHdr(), Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ id: CLOUD.id, data: S, updated_at: at }) });
    if (!r.ok) throw new Error('寫入失敗 ' + r.status);
    CLOUD_AT = at; cloudLbl('☁ 已同步 ' + fmtT(Date.now()));
  } catch (e) { cloudLbl('☁ 同步失敗', false); console.warn(e); }
  CLOUD_BUSY = false;
}
const _saveLocal = save;
save = function () { _saveLocal(); if (cloudOn()) { clearTimeout(CLOUD_T); cloudLbl('☁ 儲存中…'); CLOUD_T = setTimeout(cloudPush, 1200); } };
async function cloudPoll() {
  if (!cloudOn() || CLOUD_BUSY || CLOUD_T && $('#cloudLbl')?.textContent.includes('儲存中') || $('#modal').classList.contains('on')) return;
  try { const row = await cloudLoad(); if (row && row.updated_at > CLOUD_AT) { const cur = S.cur; S = row.data; S.cur = cur; CLOUD_AT = row.updated_at; _saveLocal(); render(); cloudLbl('☁ 已更新 ' + fmtT(Date.now())); } } catch (e) {}
}

/* ---------- 指泊動作 ---------- */
let PICK = null;
S && (S.mapMode = S.mapMode || 'real');
function nearestBerth(m, ll) { let best = null, d0 = 80; S.berths.filter(b => b.port === '水頭').forEach(b => { const d = m.distance(ll, L.latLng(bpos(b).slice(0, 2))); if (d < d0) { d0 = d; best = b; } }); return best; }
function dockShip(vid, bid) {
  const v = voy(vid), b = berth(bid); PICK = null;
  if (!v || !b) { render(); return; }
  if (!isStaff()) { toast('船席指泊需港務處人員'); render(); return; }
  if (v.move === '靠泊') { if (v.berthId === bid) { render(); return; } moveBerth(vid, bid); return; }
  const clash = S.voyages.filter(x => x.id !== vid && x.berthId === bid && x.status === '通過' && !x.actualOut && (x.actualIn || x.inTime) < v.outTime && x.outTime > v.inTime);
  if (clash.length >= b.cap && !confirm(`${b.name} 在 ${fmtS(v.inTime)}～${fmtT(v.outTime)} 已有：${clash.map(x => ship(x.shipId).name).join('、')}\n仍要指派「${ship(v.shipId).name}」？`)) { render(); return; }
  assign(vid, bid);
}
function pickV(vid) { PICK = PICK === vid ? null : vid; render(); if (PICK) toast(`已選「${esc(ship(voy(vid).shipId).name)}」，請點地圖上的船席`); }
function dragV(e, vid) { e.dataTransfer.setData('text/plain', vid); e.dataTransfer.effectAllowed = 'move'; }
function wireDrop(box, toBerth) {
  if (!box) return;
  box.addEventListener('dragover', e => { e.preventDefault(); const t = e.target.closest?.('[data-bid]'); box.querySelectorAll('.drop').forEach(x => x !== t && x.classList.remove('drop')); t && t.classList.add('drop'); });
  box.addEventListener('dragleave', e => { const t = e.target.closest?.('[data-bid]'); t && t.classList.remove('drop'); });
  box.addEventListener('drop', e => { e.preventDefault(); const vid = e.dataTransfer.getData('text/plain'); const bid = toBerth(e); if (vid && bid) dockShip(vid, bid); else toast('請放在船席上（或船席附近）'); });
}
function dockPanel() {
  const t2 = dayStart(2);
  const wait = S.voyages.filter(v => v.status === '通過' && v.move === '預報' && v.inTime < t2 && v.inTime > dayStart(-1)).sort((a, b) => (a.berthId ? 1 : 0) - (b.berthId ? 1 : 0) || a.inTime - b.inTime);
  const inport = S.voyages.filter(v => v.status === '通過' && v.move === '靠泊').sort((a, b) => a.outTime - b.outTime);
  const card = (v, kind) => { const s = ship(v.shipId); return `<div class="dcard ${PICK === v.id ? 'on' : ''}" style="--c:${SHIPC[s.type] === '#ffffff' ? '#b9c2cc' : SHIPC[s.type] || '#ccc'}" draggable="true" ondragstart="dragV(event,'${v.id}')" onclick="pickV('${v.id}')">
    <span class="grip">⋮⋮</span><div style="flex:1;min-width:0"><div class="nm">${esc(s.name)} <span class="meta">${esc(s.type)}</span></div>
    <div class="meta">${kind === 'w' ? `預定 ${fmtS(v.inTime)}｜${v.berthId ? '已排 ' + esc(berth(v.berthId)?.name || '') : '<b style="color:#c07a00">待指泊</b>'}` : `靠 ${esc(berth(v.berthId)?.name || '')}｜離 ${fmtS(v.outTime)}${v.outTime < Date.now() ? ' <b style="color:var(--red)">逾時</b>' : ''}`}</div></div></div>`; };
  return `<h3>🧲 拖曳指泊</h3><div class="small muted">把船舶卡片<b>拖到地圖船席</b>上即完成指派；在港船舶拖到別的船席＝移泊。手機：<b>先點船舶、再點船席</b>。</div>
  ${PICK ? `<div class="pickbar" style="margin-top:8px"><span>已選：<b>${esc(ship(voy(PICK).shipId).name)}</b> → 請點船席</span><button class="btn s" onclick="PICK=null;render()">取消</button></div>` : ''}
  <div class="dsec"><span>⏱ 預定進港（今明兩天）</span><span class="tag t-info">${wait.length}</span></div><div class="dlist">${wait.map(v => card(v, 'w')).join('') || '<div class="small muted">無</div>'}</div>
  <div class="dsec"><span>⚓ 在港船舶（拖曳＝移泊）</span><span class="tag t-ok">${inport.length}</span></div><div class="dlist">${inport.map(v => card(v, 'i')).join('') || '<div class="small muted">無</div>'}</div>
  ${MAPSEL ? `<hr style="border:none;border-top:1px solid var(--line);margin:12px 0">${berthPanel()}` : '<div class="small muted" style="margin-top:10px">點船席可看該船席的靠泊、排定與操作。</div>'}`;
}
selBerth = function (id) { if (PICK) { dockShip(PICK, id); return; } MAPSEL = id; render(); };

/* ---------- 港區調度頁（實景地圖／示意圖 二選一） ---------- */
VIEWS.map = () => {
  if (MAPLV !== 'harbor') return _mapView();
  const real = (S.mapMode || 'real') === 'real';
  const crumb = `<div class="crumb"><a onclick="MAPLV='region';render()">全區地圖</a> › <a onclick="MAPLV='kinmen';render()">金門</a> › <b>水頭港</b></div>`;
  const ro = !isStaff();
  return `<div class="title"><h2>港區調度（船席指泊）</h2><span class="sub">拖曳船舶到船席即可指派、移泊；點船席看詳情與靠泊／出港操作</span><div class="sp"></div>
    <div class="seg"><a class="${real ? 'on' : ''}" onclick="S.mapMode='real';save();render()">🛰️ 實景地圖</a><a class="${real ? '' : 'on'}" onclick="S.mapMode='schema';save();render()">📐 示意圖</a></div></div>${crumb}
  <div class="dockwrap"><div class="mapbox ${PICK ? 'picking' : ''}" id="dropZone">${real ? '<div id="lmap" class="lmap"></div>' : aerialSVG()}${real ? MAP_LEGEND : `<div class="legend"><span><i style="background:#2e9d5b"></i>空泊位</span><span><i style="background:#e0a100"></i>今日已排</span><span><i style="background:#e07b00"></i>泊區部分使用</span><span><i style="background:#d64545"></i>靠泊中</span><span>⏱＝今日待靠泊船數</span></div>`}</div>
  <div class="card" id="berthPanel">${ro ? berthPanel() : dockPanel()}</div></div>`;
};
AFTER.map = () => {
  if (MAPLV !== 'harbor') return;
  const box = $('#dropZone');
  if ((S.mapMode || 'real') === 'real') {
    buildMap(false);
    wireDrop(box, e => { const t = e.target.closest?.('[data-bid]'); if (t) return t.dataset.bid; if (!LMAP) return null; const nb = nearestBerth(LMAP, LMAP.mouseEventToLatLng(e)); return nb?.id; });
    if (PICK) $('#lmap')?.classList.add('picking');
  } else wireDrop(box, e => e.target.closest?.('[data-bid]')?.dataset.bid);
};

/* ---------- 說明 ---------- */
const _about = showAbout;
showAbout = function () { _about(); const mb = document.querySelector('#modal .mbody'); if (mb) mb.insertAdjacentHTML('afterbegin', `<div class="note"><b>V4（整合版）</b>：包含 V1～V3 全部功能；港區調度可在<b>實景地圖</b>（國土測繪中心空拍圖）與<b>示意圖</b>之間切換，並可<b>拖曳船舶到船席</b>完成指泊／移泊。資料儲存：${cloudOn() ? '雲端資料庫（所有人共用）' : '本機瀏覽器（各自獨立）'}。</div>`); };

/* ---------- 啟動 ---------- */
function startApp() {
load(); migrateV2(); migrateV3(); S.mapMode = S.mapMode || 'real'; _saveLocal();
VIEW = isGuest() ? 'portal' : 'dash'; render();
if (cloudOn()) {
  cloudLbl('☁ 連線中…');
  cloudLoad().then(row => {
    if (row && row.data && row.data.v3) { const cur = S.cur; S = row.data; S.cur = cur; CLOUD_AT = row.updated_at; _saveLocal(); render(); cloudLbl('☁ 雲端資料庫'); }
    else cloudPush();
    setInterval(cloudPoll, 20000);
  }).catch(e => { cloudLbl('☁ 連線失敗，使用本機資料', false); console.warn(e); });
} else cloudLbl('💾 本機資料');
}
/* V6：startApp() 移到第五段程式最後呼叫 */
</script>
<style>
/* ===== V6 ===== */
#modal{z-index:3000}

.shiptip{background:rgba(255,250,170,.95);border:1px solid #b9a300;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;color:#10233d;box-shadow:0 1px 3px rgba(0,0,0,.3)}

<script>
/* ============================================================
   V6：① 實景地圖改「真實尺寸」繪製（船、船席隨放大而變大，好點選、可直接拖船）
       ② 示意圖改成與實景同方向（陸地在下、碼頭朝北）
       ③ 停航合併：同一艘船選「頭」「尾」兩個航次，保留第一張進港＋最後一張出港，
          中間申請自動註銷（保留紀錄），費用自動重算，可取消合併
   ============================================================ */

/* ---------- 船席實景座標（依空拍圖判讀，可在地圖上拖曳校正） ---------- */
Object.assign(BPOS, { S4: [24.41662, 118.28512, -90], SB: [24.41590, 118.28512, -90], CG: [24.41838, 118.29170, 0] });
const MPD = 111320;
const offLL = (la, ln, dx, dy) => [la + dy / MPD, ln + dx / (MPD * Math.cos(la * Math.PI / 180))];
const polyAt = (c, rot, pts) => pts.map(([a, w]) => rot === -90 ? offLL(c[0], c[1], w, a) : offLL(c[0], c[1], a, -w));
const rectPts = (L, W) => [[-L / 2, -W / 2], [L / 2, -W / 2], [L / 2, W / 2], [-L / 2, W / 2]];
const hullPts = (L, W) => [[-L / 2, -W / 2], [L / 2 - W * .9, -W / 2], [L / 2, 0], [L / 2 - W * .9, W / 2], [-L / 2, W / 2]];
const bSize = b => b.cap > 1 ? [72, 26] : b.type === '小三通客輪' ? [62, 16] : [72, 18];
const sSize = s => s.type === '小三通客船' ? [46, 11] : s.type === '貨船' ? [62, 13] : s.type === '漁船' ? [22, 7] : s.type === '遊艇' ? [16, 6] : [13, 5];
const MAPVIEW_KEY = 'kmport-mapview-v6';
const getMV = () => { try { return JSON.parse(localStorage.getItem(MAPVIEW_KEY)); } catch (e) { return null; } };
const setMV = v => { try { localStorage.setItem(MAPVIEW_KEY, JSON.stringify(v)); } catch (e) {} };
const getBase = () => { try { return localStorage.getItem('kmport-mapbase') || 'PHOTO2'; } catch (e) { return 'PHOTO2'; } };

buildMap = function (ro) {
  const el = $('#lmap'); if (!el) return;
  if (!window.L) { el.outerHTML = `<div class="note">⚠️ 無法載入線上地圖（可能未連網），暫以示意圖顯示。</div>${aerialSVG()}`; return; }
  dropMap();
  const m = LMAP = L.map(el, { zoomControl: true, maxZoom: 21, zoomSnap: 0.25 });
  const mv = getMV();
  if (mv) m.setView(mv.c, mv.z);
  else {
    const pts = ['S4', 'SB', 'S1L', 'S1R', 'S2L', 'S2R', 'S3L', 'S3R'].map(id => berth(id)).filter(Boolean).flatMap(b => { const [la, ln, rot] = bpos(b); const [BL] = bSize(b); return [offLL(la, ln, 0, BL / 2 + 10), offLL(la, ln, 0, -BL / 2 - 20)]; });
    m.fitBounds(L.latLngBounds(pts.length ? pts : [[24.4160, 118.2848], [24.4170, 118.2885]]), { paddingTopLeft: [20, 30], paddingBottomRight: [20, 80], maxZoom: 19 });
  }
  const bl = {}; Object.entries(BASES).forEach(([k, b]) => bl[b.name] = L.tileLayer(b.url, { maxZoom: 21, maxNativeZoom: 19, attribution: b.attr }));
  bl[BASES[getBase()]?.name || BASES.PHOTO2.name].addTo(m);
  const shipsL = L.layerGroup().addTo(m), berthL = L.layerGroup().addTo(m), labL = L.layerGroup().addTo(m), schL = L.layerGroup().addTo(m);
  L.control.layers(bl, { '船舶圖像': shipsL, '船舶名稱': labL, '船席範圍': berthL, '今日排定（虛線）': schL }, { collapsed: window.innerWidth < 820 }).addTo(m);
  L.control.scale({ imperial: false }).addTo(m);
  m.on('baselayerchange', e => { const k = Object.keys(BASES).find(k => BASES[k].name === e.name); try { localStorage.setItem('kmport-mapbase', k); } catch (x) {} });
  m.on('overlayadd overlayremove', e => { if (e.name === '船舶名稱') el.classList.toggle('hide-lab', e.type === 'overlayremove'); });
  m.on('moveend', () => { if (LMAP !== m) return; const c = m.getCenter(); setMV({ c: [c.lat, c.lng], z: m.getZoom() }); });
  const staff = !ro && isStaff();
  const shipPolys = {};
  S.berths.filter(b => b.port === '水頭').forEach(b => {
    const [la, ln, rot] = bpos(b); const st = berthState(b); const [BL, BW] = bSize(b);
    const col = { free: '#2e9d5b', sch: '#e0a100', part: '#e07b00', full: '#d64545' }[st.state];
    const area = L.polygon(polyAt([la, ln], rot, rectPts(BL, BW)), { color: MAPSEL === b.id ? '#ffeb3b' : col, weight: MAPSEL === b.id ? 4 : 2, fillColor: col, fillOpacity: .22, dashArray: st.state === 'free' ? '6 4' : null }).addTo(berthL);
    area.on('click', () => { if (ro) area.bindPopup(berthPopup(b)).openPopup(); else selBerth(b.id); });
    // 船席名稱標籤（在船席靠陸地那一端）；「調整船席位置」時可拖曳
    const lp = rot === -90 ? offLL(la, ln, 0, -BL / 2 - 5) : offLL(la, ln, -BL / 2 - 5, 0);
    const bm = L.marker(lp, { draggable: staff && BERTH_EDIT, icon: L.divIcon({ className: '', html: `<div class="lb ${MAPSEL === b.id ? 'sel' : ''}" data-bid="${b.id}" style="--c:${col}">${esc(b.name)}${st.sch.length ? ' ⏱' + st.sch.length : ''}</div>`, iconSize: [0, 0] }) }).addTo(berthL);
    bm.on('click', () => { if (ro) bm.bindPopup(berthPopup(b)).openPopup(); else selBerth(b.id); });
    bm.on('dragend', e => { const p = e.target.getLatLng(); const c = rot === -90 ? [p.lat + (BL / 2 + 5) / MPD, p.lng] : [p.lat, p.lng + (BL / 2 + 5) / (MPD * Math.cos(p.lat * Math.PI / 180))]; S.berthPos = S.berthPos || {}; S.berthPos[b.id] = [c[0], c[1], rot]; log('校正船席位置', b.name, `${c[0].toFixed(6)}, ${c[1].toFixed(6)}`); save(); render(); toast(`已更新「${esc(b.name)}」位置`); });
    const draw = (v, i, n, sch) => {
      const s = ship(v.shipId); const [SL, SW] = sSize(s);
      const off = n > 1 ? (i - (n - 1) / 2) * Math.min(BL / n, SL + 3) : 0;
      const c = rot === -90 ? offLL(la, ln, 0, off) : offLL(la, ln, off, 0);
      const late = !sch && v.outTime < Date.now();
      const fill = SHIPC[s.type] || '#ccc';
      const poly = L.polygon(polyAt(c, rot, hullPts(SL, SW)), { color: sch ? '#ffffff' : '#0b2a4a', weight: sch ? 2 : 1.2, dashArray: sch ? '4 3' : null, fillColor: fill, fillOpacity: sch ? .45 : .95, className: staff ? 'shp' : '' }).addTo(sch ? schL : shipsL);
      const dir = /L$/.test(b.id) ? 'left' : /R$/.test(b.id) ? 'right' : 'top';
      const tip = L.tooltip({ permanent: true, direction: dir, className: 'shiptip' + (sch ? ' p' : ''), offset: dir === 'left' ? [-6, 0] : dir === 'right' ? [6, 0] : [0, -6], interactive: true })
        .setLatLng(c).setContent(`${esc(s.name)}<small>»${esc(agent(s))}</small>${late ? '<span class="bad">!</span>' : ''}${sch ? ` <small>${fmtT(v.inTime)}</small>` : ''}`);
      labL.addLayer(tip);
      poly.bindPopup(shipPopup(v, ro));
      tip.on('click', () => poly.openPopup(c));
      shipPolys[v.id] = { poly, c };
      if (staff) enableShipDrag(m, poly, v, b);
    };
    st.occ.forEach((v, i) => draw(v, i, st.occ.length, false));
    if (!st.occ.length || b.cap > 1) st.sch.forEach((v, i) => draw(v, i, st.sch.length, true));
  });
  const Search = L.Control.extend({ onAdd() {
    const d = L.DomUtil.create('div', 'lsearch');
    d.innerHTML = `<span>🔎</span><select id="lsBerth"><option value="">船席</option>${S.berths.filter(b => b.port === '水頭').map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><input id="lsShip" placeholder="船名">${staff ? `<label class="small"><input type="checkbox" id="lsEdit" ${BERTH_EDIT ? 'checked' : ''}> 調整船席位置</label>` : ''}<button class="btn s" id="lsHome" title="回到碼頭全景">⌂</button>`;
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    setTimeout(() => {
      $('#lsBerth').onchange = e => { const b = berth(e.target.value); if (b) { m.flyTo(bpos(b).slice(0, 2), 19.5); if (!ro) setTimeout(() => selBerth(b.id), 900); } };
      $('#lsShip').onchange = e => { const q = e.target.value.trim(); const v = S.voyages.find(x => x.status === '通過' && (x.move === '靠泊' || x.move === '預報') && ship(x.shipId).name.includes(q) && shipPolys[x.id]); if (!v) { toast('目前港內查無此船'); return; } m.flyTo(shipPolys[v.id].c, 19.5); setTimeout(() => { if (LMAP === m) shipPolys[v.id].poly.openPopup(shipPolys[v.id].c); }, 900); };
      $('#lsHome').onclick = () => { setMV(null); render(); };
      const ed = $('#lsEdit'); if (ed) ed.onchange = e => { BERTH_EDIT = e.target.checked; render(); toast(BERTH_EDIT ? '可拖曳船席名稱標籤到正確位置，放開即儲存' : '已關閉位置調整'); };
    });
    return d; } });

  setTimeout(() => { if (LMAP === m) m.invalidateSize(); }, 50);
};
// 在地圖上直接拖船：按住船拖到別的船席放開（滑鼠）
function enableShipDrag(m, poly, v, b) {
  poly.on('mousedown', e => {
    if (e.originalEvent.button !== 0) return;
    L.DomEvent.stop(e.originalEvent); m.dragging.disable();
    const start = e.containerPoint; let moved = false;
    const ghost = L.marker(e.latlng, { interactive: false, icon: L.divIcon({ className: '', html: `<div class="dragghost">🚢 ${esc(ship(v.shipId).name)}</div>`, iconSize: [0, 0] }) });
    const mm = ev => { if (!moved && ev.containerPoint.distanceTo(start) > 6) { moved = true; ghost.addTo(m); } if (moved) ghost.setLatLng(ev.latlng); };
    const up = ev => {
      m.off('mousemove', mm); document.removeEventListener('mouseup', upDoc); m.dragging.enable();
      if (!moved) { poly.openPopup(e.latlng); return; }
      const ll = ev.latlng || ghost.getLatLng(); ghost.remove();
      const nb = nearestBerth(m, ll);
      if (nb && nb.id !== b.id) dockShip(v.id, nb.id); else toast(nb ? '仍在原船席' : '請拖到船席附近（約 80 公尺內）');
    };
    const upDoc = ev => up({ latlng: m.mouseEventToLatLng(ev) });
    m.on('mousemove', mm); document.addEventListener('mouseup', upDoc, { once: true });
  });
}

/* ---------- 示意圖：與實景同方向（北在上、陸地在下、碼頭朝北） ---------- */
const SCH = { S4: [128, 238, 40, 112], SB: [128, 368, 40, 112], S1L: [276, 292, 40, 160], S1R: [344, 292, 40, 160], S2L: [426, 292, 40, 160], S2R: [494, 292, 40, 160],
  S3L: [576, 292, 40, 160], S3R: [644, 292, 40, 160], NB: [722, 40, 40, 150], CG: [800, 252, 180, 42], EB: [812, 110, 170, 52], EY: [812, 176, 170, 44] };
aerialSVG = function () {
  const R = rng(11);
  let tex = '';
  for (let i = 0; i < 70; i++) { const x = R() * 770, y = 520 + R() * 115; if (x > 370 && x < 630 && y < 615) continue; tex += `<rect x="${x}" y="${y}" width="${8 + R() * 24}" height="${6 + R() * 16}" fill="hsl(${30 + R() * 30},${10 + R() * 20}%,${55 + R() * 25}%)" opacity=".9"/>`; }
  for (let i = 0; i < 40; i++) { const x = 800 + R() * 190, y = 320 + R() * 310; tex += `<rect x="${x}" y="${y}" width="${8 + R() * 20}" height="${6 + R() * 16}" fill="hsl(${30 + R() * 30},12%,${58 + R() * 20}%)"/>`; }
  for (let i = 0; i < 55; i++) { const x = R() * 770, y = 525 + R() * 110; tex += `<circle cx="${x}" cy="${y}" r="${4 + R() * 8}" fill="hsl(${95 + R() * 30},35%,${28 + R() * 14}%)" opacity=".85"/>`; }
  let waves = ''; for (let i = 0; i < 90; i++) { const x = R() * 1000, y = R() * 480; waves += `<path d="M${x} ${y} q8 -4 16 0" stroke="#fff" stroke-opacity=".18" fill="none"/>`; }
  let park = ''; for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) park += `<rect x="${648 + c * 14}" y="${548 + r * 22}" width="10" height="16" fill="${R() < .6 ? ['#c33','#eee','#246','#888','#dd3'][Math.floor(R() * 5)] : 'none'}" stroke="#ddd" stroke-width=".6"/>`;
  const berths = S.berths.filter(b => b.port === '水頭').map(b => {
    const g = SCH[b.id] || [b.x ?? 900, b.y ?? 400, b.w || 70, b.h || 32];
    const bb = { ...b, x: g[0], y: g[1], w: g[2], h: g[3] };
    const st = berthState(b); const col = { free: '#2e9d5b', sch: '#e0a100', part: '#e07b00', full: '#d64545' }[st.state];
    const vert = bb.h > bb.w;
    const shipsHere = st.occ.map((v, i) => shipIcon(bb, v, i, vert)).join('');
    const ly = vert ? bb.y + bb.h + 14 : bb.y - 5;
    return `<g class="berth ${MAPSEL === b.id ? 'sel' : ''}" data-bid="${b.id}" onclick="selBerth('${b.id}')"><rect class="b" x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" rx="4" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="2"/>${shipsHere}
      <text x="${bb.x + bb.w / 2}" y="${ly}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" stroke="#0b2a4a" stroke-width="3" paint-order="stroke">${esc(b.name)}${st.sch.length ? ' ⏱' + st.sch.length : ''}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="sea6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#174f78"/><stop offset="1" stop-color="#2f7fa8"/></linearGradient>
  <linearGradient id="sand6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3d6ad"/><stop offset="1" stop-color="#cbbd94"/></linearGradient></defs>
  <rect width="1000" height="640" fill="url(#sea6)"/>${waves}
  <path d="M0 640 V512 Q120 500 240 506 Q400 516 560 504 Q680 498 778 506 V300 H1000 V640 Z" fill="#7d8f63"/>
  <path d="M0 512 Q120 500 240 506 Q400 516 560 504 Q680 498 778 506 L778 518 Q680 510 560 516 Q400 528 240 518 Q120 512 0 524Z" fill="url(#sand6)"/>
  <rect x="778" y="296" width="222" height="10" fill="url(#sand6)"/>
  ${tex}
  <path d="M0 628 L780 620" stroke="#bfb9ad" stroke-width="9"/><path d="M500 640 V615" stroke="#bfb9ad" stroke-width="7"/><path d="M880 640 V320" stroke="#bfb9ad" stroke-width="8"/>
  <rect x="370" y="534" width="250" height="78" fill="#e9ecef" stroke="#9aa"/><rect x="380" y="544" width="230" height="58" fill="#cfd8dc"/><text x="495" y="579" text-anchor="middle" font-size="14" fill="#33424f" font-weight="700">旅客服務中心</text>
  <rect x="640" y="540" width="124" height="76" fill="#5f6b73" opacity=".7"/>${park}<text x="702" y="535" text-anchor="middle" font-size="11" fill="#fff">停車場</text>
  <rect x="104" y="226" width="22" height="290" fill="#d7d2c4" stroke="#8d8676"/>
  ${[320, 470, 620].map(x => `<rect x="${x}" y="280" width="20" height="230" fill="#d7d2c4" stroke="#8d8676"/>`).join('')}
  <rect x="766" y="16" width="24" height="292" fill="#9c9c9c"/><rect x="772" y="16" width="12" height="292" fill="#bdbdbd" stroke-dasharray="4 3"/>
  <rect x="802" y="104" width="6" height="128" fill="#c9c2b0"/>
  <text x="300" y="40" text-anchor="middle" font-size="13" fill="#e3f2ff" font-weight="700">⇡ 港口出入口（往北）</text>
  <text x="975" y="30" text-anchor="end" font-size="14" fill="#e3f2ff" font-weight="700">N ↑</text>
  <text x="20" y="630" font-size="11" fill="#fff" opacity=".85">※ 示意圖，方位與實景地圖相同（北在上）</text>

<script>
/* ---------- 停航合併（選頭尾） ---------- */
let MG = {};
const mgCands = sid => S.voyages.filter(v => v.shipId === sid && ['通過', '待審'].includes(v.status) && !v.actualOut && v.inTime > dayStart(-10)).sort((a, b) => a.inTime - b.inTime);
function mergeTool(vid) {
  if (!isStaff()) { toast('停航合併需港務處人員'); return; }
  const v = vid ? voy(vid) : null;
  const ships = S.ships.filter(s => mgCands(s.id).length >= 2);
  const sid = v && mgCands(v.shipId).length >= 2 ? v.shipId : (VY.ship && mgCands(VY.ship).length >= 2 ? VY.ship : ships[0]?.id);
  if (!sid) { toast('目前沒有可合併的航次（同一艘船需有 2 個以上未出港航次）'); return; }
  const c = mgCands(sid);
  MG = { ship: sid, head: v && v.shipId === sid ? v.id : c[0].id, tail: c[c.length - 1].id, reason: '天候因素停航' };
  if (MG.head === MG.tail) MG.tail = c[c.length - 1].id;
  mergeModal();
}
function mgPick(k, id) { MG[k] = id; const c = mgCands(MG.ship); const hi = c.findIndex(v => v.id === MG.head), ti = c.findIndex(v => v.id === MG.tail); if (ti <= hi) { if (k === 'head') MG.tail = c[Math.min(hi + 1, c.length - 1)].id; else MG.head = c[Math.max(ti - 1, 0)].id; } mergeModal(); }
function mergeModal() {
  const c = mgCands(MG.ship); const s = ship(MG.ship);
  const h = voy(MG.head), t = voy(MG.tail);
  const hi = c.indexOf(h), ti = c.indexOf(t);
  const mids = c.filter((v, i) => i > hi && i <= ti);
  const ships = S.ships.filter(x => mgCands(x.id).length >= 2);
  const keepLeave = t ? appsOf(t.id, '出港').find(a => a.status !== '註銷') : null;
  const keepIn = h ? appsOf(h.id, '進港').find(a => a.status !== '註銷') : null;
  const cancelApps = mids.flatMap(v => appsOf(v.id)).filter(a => a !== keepLeave && a.status !== '註銷').length + (keepLeave ? appsOf(h.id, '出港').filter(a => a.status !== '註銷').length : 0);
  const fee = h && t ? feeOf({ ...h, outTime: t.outTime, actualOut: null, status: '通過' }) : null;
  const span = h && t ? Math.round((t.outTime - (h.actualIn || h.inTime)) / 3600e3) : 0;
  // 時間軸
  const t0 = Math.min(...c.map(v => v.inTime)) - 2 * 3600e3, t1 = Math.max(...c.map(v => v.outTime)) + 2 * 3600e3, W = t1 - t0;
  const px = x => ((x - t0) / W * 100).toFixed(2) + '%';
  let days = ''; for (let d = dayStart(Math.floor((t0 - dayStart(0)) / 864e5) + 1); d < t1; d += 864e5) days += `<div class="day" style="left:${px(d)}">${fmtD(d).slice(5)}</div>`;
  const tl = `<div class="mg-tl">${days}${h && t ? `<div class="rng" style="left:${px(h.actualIn || h.inTime)};width:calc(${px(t.outTime)} - ${px(h.actualIn || h.inTime)})"></div>` : ''}
    ${c.map((v, i) => `<div class="seg ${v === h ? 'h' : v === t ? 't' : i > hi && i < ti ? 'm' : ''}" style="left:${px(v.actualIn || v.inTime)};width:max(6px,calc(${px(v.outTime)} - ${px(v.actualIn || v.inTime)}))" title="${v.code} ${fmtS(v.inTime)}～${fmtS(v.outTime)}">${v.code.split('-').pop()}</div>`).join('')}</div>
    <div class="small muted">藍＝頭（保留進港）、綠＝尾（保留出港）、灰色虛線＝中間被併入、黃框＝合併後的靠泊期間</div>`;
  modal(`🔗 停航合併：${esc(s.name)}`, `
  <div class="note">船舶停航或故障在港多停幾天，中間又申請了好幾次進出港時使用：只要選<b>「頭」</b>（實際進港那一次）和<b>「尾」</b>（真正出港那一次），系統會<b>保留第一張進港申請＋最後一張出港申請</b>，中間的申請自動註銷（紀錄保留、可取消合併），碇泊費依整段靠泊時間自動重算。</div>
  <div class="flex" style="margin-bottom:6px"><b>船舶</b><select class="btn" onchange="MG.ship=this.value;const c=mgCands(this.value);MG.head=c[0].id;MG.tail=c[c.length-1].id;mergeModal()">${ships.map(x => `<option value="${x.id}" ${x.id === MG.ship ? 'selected' : ''}>${esc(x.name)}（${mgCands(x.id).length} 個未出港航次）</option>`).join('')}</select>
  <b>原因</b><select class="btn" onchange="MG.reason=this.value">${['天候因素停航', '船舶故障維修', '港口管制', '其他'].map(r => `<option ${MG.reason === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
  ${tl}
  <div class="tbl"><table class="mgt"><tr><th>頭</th><th>尾</th><th>航次</th><th>預定進港</th><th>預定出港</th><th>船席</th><th>進港申請</th><th>出港申請</th><th>合併後</th></tr>
  ${c.map((v, i) => { const ia = appsOf(v.id, '進港').find(a => a.status !== '註銷'), oa = appsOf(v.id, '出港').find(a => a.status !== '註銷');
    const role = v === h ? '<b style="color:#1f4e8c">保留進港</b>' : v === t ? '<b style="color:#1d6b3e">保留出港</b>' : i > hi && i < ti ? '<span style="color:#a12f2f">併入（註銷）</span>' : '<span class="muted">不受影響</span>';
    return `<tr class="${v === h ? 'h' : v === t ? 't' : i > hi && i < ti ? 'in' : ''}"><td><input type="radio" name="mgH" ${v === h ? 'checked' : ''} onclick="mgPick('head','${v.id}')" ${i === c.length - 1 ? 'disabled' : ''}></td><td><input type="radio" name="mgT" ${v === t ? 'checked' : ''} onclick="mgPick('tail','${v.id}')" ${i === 0 ? 'disabled' : ''}></td>
    <td>${v.code}${v.move === '靠泊' ? ' <span class="tag t-ok">靠泊中</span>' : ''}</td><td>${fmtS(v.inTime)}</td><td>${fmtS(v.outTime)}</td><td>${esc(berth(v.berthId)?.name || '—')}</td><td>${ia ? ia.no + ' ' + tag(ia.status) : '—'}</td><td>${oa ? oa.no + ' ' + tag(oa.status) : '—'}</td><td>${role}</td></tr>`; }).join('')}</table></div>
  ${h && t ? `<div class="note" style="margin-top:10px;background:#eef6ff;border-color:#bcd4f5">合併結果：<b>${h.code}</b> 進港 ${fmtS(h.actualIn || h.inTime)} → 出港 <b>${fmtS(t.outTime)}</b>（次一港 ${esc(t.nextPort)}），在港約 <b>${Math.floor(span / 24)} 天 ${span % 24} 小時</b><br>
  保留：進港申請 ${keepIn ? keepIn.no : '（無）'}＋出港申請 ${keepLeave ? keepLeave.no + '（由 ' + t.code + ' 移過來）' : '（沿用頭航次的出港申請並改時間）'}；自動註銷 <b>${cancelApps}</b> 張申請、併入 <b>${mids.length}</b> 個航次<br>
  碇泊費＋垃圾清理費：<b>${money(fee.total)} 元</b>（${fee.hours} 小時 × 費率 ${fee.rate}）</div>` : ''}`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="applyMerge()" ${h && t && ti > hi ? '' : 'disabled'}>確認合併</button>`, true);
}
function applyMerge() {
  const c = mgCands(MG.ship); const h = voy(MG.head), t = voy(MG.tail);
  const hi = c.indexOf(h), ti = c.indexOf(t);
  if (!h || !t || ti <= hi) { toast('請選擇頭與尾'); return; }
  const mids = c.filter((v, i) => i > hi && i <= ti);
  const undo = { outTime: h.outTime, nextPort: h.nextPort, remark: h.remark, vs: mids.map(v => ({ id: v.id, status: v.status, remark: v.remark || '' })), apps: [] };
  const keepLeave = appsOf(t.id, '出港').find(a => a.status !== '註銷');
  const mark = (a, reason) => { undo.apps.push({ id: a.id, status: a.status, reason: a.reason || '', voyageId: a.voyageId, f: { outTime: a.f.outTime, nextPort: a.f.nextPort } }); a.status = '註銷'; a.reason = reason; };
  mids.forEach(v => appsOf(v.id).forEach(a => { if (a !== keepLeave && a.status !== '註銷') mark(a, `停航合併：併入 ${h.code}`); }));
  appsOf(h.id, '出港').filter(a => a.status !== '註銷').forEach(a => {
    if (keepLeave) mark(a, `停航合併：改用 ${t.code} 的出港申請`);
    else { undo.apps.push({ id: a.id, status: a.status, reason: a.reason || '', voyageId: a.voyageId, f: { outTime: a.f.outTime, nextPort: a.f.nextPort } }); a.f.outTime = t.outTime; a.f.nextPort = t.nextPort; }
  });
  if (keepLeave) { undo.apps.push({ id: keepLeave.id, status: keepLeave.status, reason: keepLeave.reason || '', voyageId: keepLeave.voyageId, f: { outTime: keepLeave.f.outTime, nextPort: keepLeave.f.nextPort } }); keepLeave.voyageId = h.id; }
  mids.forEach(v => { v.status = '停航取消'; v.remark = `${MG.reason}：併入 ${h.code}`; v.mergedInto = h.id; });
  h.outTime = t.outTime; h.nextPort = t.nextPort; h.remark = `${MG.reason}：合併至 ${t.code}（共 ${mids.length + 1} 航次）`;
  h.merge = { at: Date.now(), by: me().name, reason: MG.reason, tail: t.code, ids: mids.map(v => v.id), undo };
  log('停航合併', `${ship(h.shipId).name} ${h.code}`, `頭 ${h.code}、尾 ${t.code}；註銷 ${undo.apps.filter(x => S.apps.find(a => a.id === x.id)?.status === '註銷').length} 張申請；出港改為 ${fmt(t.outTime)}`);
  save(); closeModal(); render();
  toast(`✔ 已合併：${esc(ship(h.shipId).name)} 保留第一張進港＋最後一張出港，中間申請已註銷，費用已重算`, 'ok');
}
function undoMerge(hid) {
  const h = voy(hid); const u = h?.merge?.undo; if (!u) return;
  if (!confirm(`取消 ${h.code} 的停航合併，恢復成合併前的各航次與申請？`)) return;
  h.outTime = u.outTime; h.nextPort = u.nextPort; h.remark = u.remark;
  u.vs.forEach(x => { const v = voy(x.id); if (v) { v.status = x.status; v.remark = x.remark; delete v.mergedInto; } });
  u.apps.forEach(x => { const a = S.apps.find(y => y.id === x.id); if (a) { a.status = x.status; a.reason = x.reason; a.voyageId = x.voyageId; Object.assign(a.f, x.f); } });
  delete h.merge; log('取消停航合併', `${ship(h.shipId).name} ${h.code}`); save(); render(); toast('已取消合併，恢復原本的航次與申請', 'ok');
}

/* ---------- 航次管理頁（加入合併） ---------- */
VIEWS.voyage = () => {
  const ro = !canEdit(); const staff = isStaff() && !ro;
  let vs = visibleVoyages().filter(v => v.inTime >= dayStart(VY.from));
  if (VY.ship) vs = vs.filter(v => v.shipId === VY.ship);
  vs.sort((a, b) => a.inTime - b.inTime);
  return `<div class="title"><h2>航次管理</h2><span class="sub">航次＝一次「進港＋出港」｜編碼：船舶代碼－民國年－當年流水，另顯示累計航次</span><div class="sp"></div>${staff ? `<button class="btn p" onclick="mergeTool()">🔗 停航合併（選頭尾）</button>` : ''}</div>
  <div class="note"><b>船停航、故障多停幾天怎麼辦？</b>按「🔗 停航合併」→ 選這艘船的<b>頭</b>（實際進港那次）和<b>尾</b>（真正出港那次）→ 確認。系統保留第一張進港＋最後一張出港申請，中間的自動註銷（可取消合併），碇泊費自動依整段時間重算。<br>
  只是延後出港、後面沒有其他申請時，用該列的「延後出港」即可。</div>
  <div class="bar"><select onchange="VY.ship=this.value;render()"><option value="">全部船舶</option>${visibleShips().map(s => `<option value="${s.id}" ${VY.ship === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
  <select onchange="VY.from=+this.value;render()">${[[-3, '近 3 天起'], [-7, '近 7 天起'], [-30, '近 30 天起']].map(o => `<option value="${o[0]}" ${VY.from === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
  <button class="btn" onclick="VY.ship=S.ships.find(s=>s.code==='XDF')?.id||'';render()">🔎 看新東方案例</button></div>
  <div class="tbl"><table><tr><th>航次編碼</th><th class="num">累計</th><th>船名</th><th>預定進港</th><th>預定出港</th><th>實際進港</th><th>實際出港</th><th>船席</th><th>狀態</th><th>動態</th><th class="num">計費(元)</th><th></th></tr>
  ${vs.map(v => { const f = feeOf(v); const into = v.mergedInto ? voy(v.mergedInto) : null; const canM = staff && v.status === '通過' && v.move !== '已出港' && mgCands(v.shipId).filter(x => x.inTime > v.inTime).length;
    return `<tr style="${v.status === '停航取消' ? 'opacity:.6' : ''}${v.merge ? ';background:#eef6ff' : ''}"><td>${v.code}${v.merge ? `<div><span class="tag t-info">🔗 合併 ${v.merge.ids.length + 1} 航次</span></div>` : ''}</td><td class="num">${v.cum}</td><td>${esc(ship(v.shipId).name)}</td><td>${fmtS(v.inTime)}</td><td>${fmtS(v.outTime)}</td><td>${fmtS(v.actualIn)}</td><td>${fmtS(v.actualOut)}</td><td>${esc(berth(v.berthId)?.name || '—')}</td>
    <td>${tag(v.status)}${into ? `<div class="small muted">已併入 ${into.code}</div>` : v.remark ? `<div class="small muted">${esc(v.remark)}</div>` : ''}</td><td>${tag(v.move)}</td><td class="num">${f.total ? money(f.total) : '—'}</td>
    <td style="white-space:nowrap">${staff && v.status === '通過' && v.move !== '已出港' ? `<button class="btn s" onclick="openShift('${v.id}')">延後出港</button>` : ''}${canM ? `<button class="btn s" onclick="mergeTool('${v.id}')">🔗 合併</button>` : ''}${staff && v.merge && !v.actualOut ? `<button class="btn r s" onclick="undoMerge('${v.id}')">取消合併</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="12" class="empty">查無資料</td></tr>'}</table></div>`;
};
// 船舶彈窗、航次異動視窗加上「停航合併」入口
const _shipPopup6 = shipPopup;
shipPopup = function (v, ro) { const h = _shipPopup6(v, ro); return !ro && isStaff() && mgCands(v.shipId).filter(x => x.inTime > v.inTime).length ? h + `<div style="margin-top:6px"><button class="btn s" onclick="mergeTool('${v.id}')">🔗 停航合併（選頭尾）</button></div>` : h; };
const _openShift6 = openShift;
openShift = function (id) {
  _openShift6(id); const v = voy(id);
  if (v && mgCands(v.shipId).filter(x => x.inTime > v.inTime).length) $('#modal .mbody')?.insertAdjacentHTML('afterbegin', `<div class="note" style="background:#eef6ff;border-color:#bcd4f5">💡 這艘船後面還有其他進出港申請。若要「只保留頭和尾」，建議改用 <button class="btn p s" onclick="closeModal();mergeTool('${id}')">🔗 停航合併（選頭尾）</button></div>`);
};
const _about6 = showAbout;
showAbout = function () { _about6(); $('#modal .mbody')?.insertAdjacentHTML('afterbegin', `<div class="note"><b>V6</b>：實景地圖改真實尺寸（船與船席隨放大變大、可直接拖船移泊）；示意圖改成與實景同方向；新增「停航合併（選頭尾）」。</div>`); };

/* ---------- 啟動 ---------- */
startApp();
</script>
</body>
